<script>
'use strict';
const $ = (id) => document.getElementById(id);
const money = (n) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(n / 100);
const dateTime = (v) => v ? new Date(v).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }) : '—';
const paymentText = value => ({ PENDING: 'PAGAMENTO PENDENTE', PROOF_SUBMITTED: 'COMPROVANTE EM CONFERÊNCIA', PAID: 'PAGO — COMPROVANTE CONFERIDO' }[value] || 'PAGAMENTO PENDENTE');
const reservationText = value => ({ RESERVED: 'RESERVA PROVISÓRIA', CONFIRMED: 'VAGA GARANTIDA', EXPIRED: 'RESERVA EXPIRADA', CANCELLED: 'INSCRIÇÃO CANCELADA' }[value] || 'RESERVA PROVISÓRIA');
function el(tag, text, className) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (className) e.className = className; return e; }
function message(id, text, success = false) { const e = $(id); e.textContent = text || ''; e.className = success ? 'success' : 'error'; e.hidden = !text; if (text && !success) e.focus(); }
function api(action, input = {}) {
  return new Promise((resolve, reject) => {
    const ok = (result) => result && result.ok ? resolve(result.data) : reject(new Error(result?.error || 'Resposta indisponível. Tente novamente.'));
    const bad = () => reject(new Error('Não foi possível conectar. Confira sua conexão e tente novamente; o mesmo envio não será duplicado.'));
    if (window.CEIA_DEMO) {
      fetch('/api/' + CONFIG.mode, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, input }) }).then(r => r.json()).then(ok).catch(bad);
    } else {
      const runner = google.script.run.withSuccessHandler(ok).withFailureHandler(bad);
      if (CONFIG.mode === 'admin') runner.adminApi(action, input); else runner.publicApi(action, input);
    }
  });
}
async function busy(button, fn) {
  if (button.disabled) return;
  const text = button.textContent; button.disabled = true; button.textContent = 'Aguarde…'; button.setAttribute('aria-busy', 'true');
  try { await fn(); } finally { button.textContent = text; button.disabled = false; button.removeAttribute('aria-busy'); }
}
async function copyText(text, button) {
  try {
    if (navigator.clipboard) await navigator.clipboard.writeText(text);
    else { const a = el('textarea'); a.value = text; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.append(a); a.select(); if (!document.execCommand('copy')) throw new Error(); a.remove(); }
    const original = button.textContent; button.textContent = 'Copiado!'; setTimeout(() => button.textContent = original, 2300);
  } catch { window.prompt('Copie o texto abaixo:', text); }
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type })); const a = el('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function phoneDigits(value) {
  let n = String(value || '').replace(/\D/g, '');
  if ((n.length === 12 || n.length === 13) && n.startsWith('55')) n = n.slice(2);
  return n.slice(0, 11);
}
function formatPhone(value) {
  const n = phoneDigits(value);
  if (!n) return '';
  if (n.length < 3) return '(' + n + (n.length === 2 ? ')' : '');
  const body = n.slice(2), split = body.startsWith('9') || body.length > 8 ? 5 : 4;
  return '(' + n.slice(0, 2) + ') ' + body.slice(0, split) + (body.length > split ? '-' + body.slice(split) : '');
}
function installPhoneMask(input) {
  function update() {
    const original = input.value, caret = input.selectionStart ?? original.length;
    const allDigits = original.replace(/\D/g, '');
    let digitPosition = original.slice(0, caret).replace(/\D/g, '').length;
    if ((allDigits.length === 12 || allDigits.length === 13) && allDigits.startsWith('55')) digitPosition = Math.max(0, digitPosition - 2);
    const atEnd = caret === original.length, formatted = formatPhone(original);
    input.value = formatted;
    if (document.activeElement !== input) return;
    let next = atEnd ? formatted.length : 0;
    if (!atEnd) {
      let seen = 0;
      while (next < formatted.length && seen < digitPosition) { if (/\d/.test(formatted[next])) seen++; next++; }
    }
    input.setSelectionRange(next, next);
  }
  input.addEventListener('input', update);
  input.addEventListener('change', update);
  // Ao apagar junto a parênteses, espaço ou hífen, remover também o dígito
  // vizinho para a máscara não prender o cursor em um separador.
  input.addEventListener('beforeinput', event => {
    const start = input.selectionStart, end = input.selectionEnd;
    if (start === null || start !== end) return;
    const value = input.value;
    if (event.inputType === 'deleteContentBackward' && start > 0 && /\D/.test(value[start - 1])) {
      let index = start - 1; while (index >= 0 && /\D/.test(value[index])) index--;
      if (index < 0) return;
      event.preventDefault(); input.value = value.slice(0, index) + value.slice(start); input.setSelectionRange(index, index); update();
    } else if (event.inputType === 'deleteContentForward' && start < value.length && /\D/.test(value[start])) {
      let index = start; while (index < value.length && /\D/.test(value[index])) index++;
      if (index >= value.length) return;
      event.preventDefault(); input.value = value.slice(0, start) + value.slice(index + 1); input.setSelectionRange(start, start); update();
    }
  });
  update();
}
</script>
