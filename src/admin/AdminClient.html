<script>
let state = { rows: [], metrics: {}, actor: CONFIG.actor }, area = CONFIG.actor.role === 'door' ? 'door' : 'treasury', pendingAction = null;
const roleNames = { admin: 'Administrador', treasury: 'Tesouraria', door: 'Conferência de entrada' };
$('actor').textContent = state.actor.email + ' · ' + roleNames[state.actor.role];
if (state.actor.role === 'door') $('tab-treasury').hidden = true;
if (state.actor.role === 'treasury') $('tab-door').hidden = true;
function setArea(next) {
  area = next; $('admin-title').textContent = area === 'door' ? 'Conferência de entrada' : 'Painel da tesouraria';
  $('tab-treasury').setAttribute('aria-selected', area === 'treasury'); $('tab-door').setAttribute('aria-selected', area === 'door'); renderTable();
}
$('tab-treasury').onclick = () => setArea('treasury'); $('tab-door').onclick = () => setArea('door');
function renderMetrics() {
  const m = state.metrics; $('metrics').replaceChildren();
  const items = [['Famílias inscritas', m.families], ['Total de participantes', m.people], ['Pessoas com pagamento confirmado', m.paidPeople], ['Pessoas com pagamento pendente', m.pendingPeople]];
  const capacity = state.capacity;
  if (capacity?.configured) items.unshift(['Vagas restantes', capacity.remaining], ['Limite de participantes', capacity.limit]);
  if (state.actor.role !== 'door') items.push(['Valor total recebido', money(m.received)], ['Valor ainda pendente', money(m.pending)]);
  items.push(['Famílias que já entraram', m.enteredFamilies], ['Pessoas nas entradas (estimativa)', m.enteredPeople]);
  items.forEach(([label, value]) => { const card = el('div', undefined, 'metric'); card.append(el('span', label), el('strong', String(value ?? 0))); $('metrics').append(card); });
}
function normalized(value) { return String(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function filteredRows() {
  const q = normalized($('search').value.trim()), digits = q.replace(/\D/g, '');
  return state.rows.filter(r => {
    const match = !q || normalized(r.name).includes(q) || normalized(r.id).includes(q) || (digits.length > 1 && !/[a-z]/.test(q) && r.phone.includes(digits));
    return match && ($('payment-filter').value === 'all' || r.status === $('payment-filter').value) && ($('entry-filter').value === 'all' || (Boolean(r.entryAt) === ($('entry-filter').value === 'entered')));
  }).sort((a, b) => (Number(b.status === 'PAID') - Number(a.status === 'PAID')) || a.name.localeCompare(b.name, 'pt-BR'));
}
function badge(text, paid) { return el('span', text, 'status' + (paid ? ' paid' : '')); }
function actionButton(text, fn, disabled = false) { const b = el('button', text, 'btn secondary'); b.type = 'button'; b.disabled = disabled; b.onclick = fn; return b; }
function renderTable() {
  $('table-head').replaceChildren(); const header = el('tr');
  const columns = ['Responsável', 'Pessoas', 'Pagamento', ...(area === 'treasury' ? ['Valor'] : []), 'Entrada', 'Ação'];
  columns.forEach(title => { const th = el('th', title); th.scope = 'col'; header.append(th); }); $('table-head').append(header);
  const root = $('table-body'); root.replaceChildren(); const rows = filteredRows();
  $('result-count').textContent = rows.length + (rows.length === 1 ? ' inscrição encontrada' : ' inscrições encontradas');
  if (!rows.length) { const tr = el('tr'), td = el('td', 'Nenhuma inscrição encontrada.', 'empty'); td.colSpan = columns.length; tr.append(td); root.append(tr); }
  rows.forEach(r => {
    const tr = el('tr', undefined, r.status === 'PAID' ? 'is-paid' : ''), name = el('td'); name.append(el('strong', r.name), el('small', formatPhone(r.phone)), el('small', r.id)); tr.append(name, el('td', String(r.people)));
    const payment = el('td'); payment.append(badge(r.status === 'PAID' ? 'PAGO' : 'PENDENTE', r.status === 'PAID'));
    if (r.reportedAt) payment.append(el('small', 'Participante avisou que pagou'));
    tr.append(payment); if (area === 'treasury') tr.append(el('td', money(r.total)));
    const entry = el('td'); entry.append(el('span', r.entryAt ? 'Confirmada' : 'Pendente')); if (r.entryAt) entry.append(el('small', dateTime(r.entryAt))); if (r.entryOverride) entry.append(el('small', 'Liberação excepcional')); tr.append(entry);
    const actions = el('td');
    if (area === 'treasury') {
      actions.append(actionButton(r.status === 'PAID' ? 'DESFAZER PAGAMENTO' : 'CONFIRMAR PAGAMENTO', () => openDialog(r, 'payment'), Boolean(r.entryAt) && r.status === 'PAID'));
      actions.append(el('br'), actionButton('Histórico', () => openAudit(r)));
      if (r.proofAt) actions.append(el('br'), actionButton('Baixar comprovante', () => getProof(r, actions.lastChild)));
    } else if (r.entryAt) actions.append(el('span', 'ENTRADA REGISTRADA', 'small muted'));
    else if (r.status === 'PAID') actions.append(actionButton('CONFIRMAR ENTRADA', () => confirmEntry(r, actions.firstChild)));
    else if (state.actor.role === 'admin') actions.append(actionButton('LIBERAÇÃO EXCEPCIONAL', () => openDialog(r, 'override')));
    else actions.append(el('span', 'Aguarde a tesouraria', 'small muted'));
    tr.append(actions); root.append(tr);
  });
}
async function load() {
  message('admin-error', '');
  try { state = await api('list'); renderMetrics(); renderTable(); $('updated-at').textContent = 'Dados atualizados em ' + dateTime(new Date().toISOString()) + ' (Brasília). Atualize antes de conferir pagamentos ou entradas.'; }
  catch (e) { message('admin-error', e.message); $('result-count').textContent = 'Não foi possível carregar a lista.'; }
}
$('reload').onclick = () => busy($('reload'), load);
for (const id of ['search', 'payment-filter', 'entry-filter']) $(id).addEventListener(id === 'search' ? 'input' : 'change', renderTable);
function openDialog(row, action) {
  pendingAction = { row, action }; $('action-note').value = ''; message('dialog-error', '');
  const pay = action === 'payment', undo = pay && row.status === 'PAID';
  $('dialog-title').textContent = pay ? (undo ? 'Desfazer confirmação?' : 'Confirmar recebimento?') : 'Liberar entrada não paga?';
  $('dialog-description').textContent = row.name + ' · ' + row.people + ' pessoa(s)' + (pay ? ' · ' + money(row.total) : '');
  $('note-label').textContent = pay && !undo ? 'Referência do recebimento no extrato do Itaú' : 'Motivo obrigatório';
  $('dialog-help').textContent = pay ? 'Esta ação ficará registrada com sua conta Google, data e horário. Confira o extrato bancário.' : 'Somente o administrador pode liberar uma inscrição pendente. O pagamento continuará pendente e o motivo será registrado.';
  $('action-dialog').showModal();
}
$('cancel-dialog').onclick = () => $('action-dialog').close();
$('action-form').onsubmit = e => {
  e.preventDefault(); busy($('submit-action'), async () => {
    message('dialog-error', ''); const { row, action } = pendingAction;
    try {
      if (action === 'payment') await api('payment', { id: row.id, paid: row.status !== 'PAID', note: $('action-note').value });
      else await api('entry', { id: row.id, reason: $('action-note').value });
      $('action-dialog').close(); message('admin-success', action === 'payment' ? 'Situação do pagamento atualizada. Alteração registrada no histórico.' : 'Entrada excepcional registrada; o pagamento permanece pendente.', true); await load();
    } catch (e) { message('dialog-error', e.message); }
  });
};
async function confirmEntry(row, button) {
  await busy(button, async () => {
    message('admin-error', '');
    try { await api('entry', { id: row.id }); message('admin-success', 'Entrada confirmada: ' + row.name + ' · ' + row.people + ' pessoa(s).', true); await load(); }
    catch (e) { await load(); message('admin-error', e.message); }
  });
}
function openAudit(row) {
  const root = $('audit-content'); root.replaceChildren(el('h3', row.name), el('p', row.id, 'small muted'));
  const audit = el('div', undefined, 'audit');
  const labels = { PAYMENT_CONFIRMED: 'Pagamento confirmado', PAYMENT_REVERSED: 'Pagamento desfeito', ENTRY_CONFIRMED: 'Entrada confirmada', ENTRY_OVERRIDE: 'Liberação excepcional' };
  if (!row.audit?.length) audit.append(el('p', 'Nenhuma alteração registrada.'));
  (row.audit || []).forEach(a => audit.append(el('p', (labels[a.action] || a.action) + '\n' + dateTime(a.at) + ' · ' + a.by + (a.note ? '\n' + a.note : ''))));
  audit.style.whiteSpace = 'pre-wrap'; root.append(audit); $('audit-dialog').showModal();
}
$('close-audit').onclick = () => $('audit-dialog').close();
function csvCell(v) { let s = String(v ?? ''); if (/^[\s]*[=+@\-\t\r\n]/.test(s)) s = "'" + s; return '"' + s.replaceAll('"', '""') + '"'; }
$('export').onclick = () => {
  const treasury = area === 'treasury';
  const header = ['Inscrição', 'Responsável', 'WhatsApp', 'Pessoas', 'Pagamento', ...(treasury ? ['Valor (R$)', 'Confirmado em', 'Conferido por', 'Aviso do participante', ...CONFIG.event.categories.map(c => c.label)] : []), 'Entrada em', 'Exceção'];
  const rows = filteredRows().map(r => [r.id, r.name, r.phone, r.people, r.status === 'PAID' ? 'Pago' : 'Pendente', ...(treasury ? [(r.total / 100).toFixed(2).replace('.', ','), dateTime(r.paidAt), r.paidBy, dateTime(r.reportedAt), ...CONFIG.event.categories.map(c => r.counts[c.key])] : []), dateTime(r.entryAt), r.entryOverride ? 'Sim' : 'Não']);
  download('ceia-ipdiv-' + area + '.csv', '\uFEFF' + [header, ...rows].map(r => r.map(csvCell).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
};
$('print-list').onclick = () => window.print();
setArea(area); load();
</script>

<script>
async function getProof(row, button) {
  await busy(button, async () => {
    try {
      const file = await api('getProof', { id: row.id });
      const bytes = Uint8Array.from(atob(file.base64), char => char.charCodeAt(0));
      download(file.name, bytes, file.mime);
    } catch (e) { message('admin-error', e.message); }
  });
}
</script>
