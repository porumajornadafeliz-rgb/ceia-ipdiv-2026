<script>
let state = { rows: [], metrics: {}, actor: CONFIG.actor }, area = CONFIG.actor.role === 'door' ? 'door' : 'registrations', pendingRow = null, pendingAction = "cancel", pendingPart = null, proofViewed = new Map();
const roleNames = { admin: 'Administrador', treasury: 'Secretaria', door: 'Conferência de entrada' };
$('actor').textContent = state.actor.email + ' · ' + roleNames[state.actor.role];
if (state.actor.role === 'door') $('tab-treasury').hidden = true;
if (state.actor.role === 'treasury') $('tab-door').hidden = true;
function setArea(next) {
  area = next; $('admin-title').textContent = area === 'door' ? 'Conferência de entrada' : 'Inscrições e vagas';
  $('tab-treasury').setAttribute('aria-selected', area === 'registrations'); $('tab-door').setAttribute('aria-selected', area === 'door'); renderTable();
}
$('tab-treasury').onclick = () => setArea('registrations'); $('tab-door').onclick = () => setArea('door');
function renderMetrics() {
  $('payment-filter-field').hidden = state.actor.role === 'door'; $('export-parts').hidden = state.actor.role === 'door';
  const m = state.metrics; $('metrics').replaceChildren();
  const items = [['Vagas restantes', state.capacity?.remaining ?? '—'], ['Limite de participantes', state.capacity?.limit ?? '—'], ['Famílias inscritas', m.families], ['Participantes inscritos', m.people], ['Famílias que já entraram', m.enteredFamilies], ['Pessoas nas entradas (estimativa)', m.enteredPeople], ['Inscrições canceladas', m.cancelledFamilies]];
  if (state.actor.role !== 'door') items.push(['Pagamentos confirmados', money(m.receivedTotal)], ['Saldo a receber nas inscrições ativas', money(m.pendingTotal)], ['Pessoas com vagas garantidas', m.confirmedPeople], ['Reservas expiradas', m.expiredFamilies]);
  items.forEach(([label, value]) => { const card = el('div', undefined, 'metric'); card.append(el('span', label), el('strong', String(value ?? 0))); $('metrics').append(card); });
}
function normalized(value) { return String(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function filteredRows() {
  const q = normalized($('search').value.trim()), digits = q.replace(/\D/g, '');
  return state.rows.filter(r => {
    const match = !q || normalized(r.name).includes(q) || normalized(r.id).includes(q) || (digits.length > 1 && !/[a-z]/.test(q) && r.phone.includes(digits));
    return match && (state.actor.role === 'door' || $('payment-filter').value === 'all' || r.paymentStatus === $('payment-filter').value) && ($('registration-filter').value === 'all' || r.status === $('registration-filter').value) && ($('entry-filter').value === 'all' || (Boolean(r.entryAt) === ($('entry-filter').value === 'entered')));
  }).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
}
function actionButton(text, fn, disabled = false) { const b = el('button', text, 'btn secondary'); b.type = 'button'; b.disabled = disabled; b.onclick = fn; return b; }
function renderTable() {
  $('table-head').replaceChildren(); const header = el('tr');
  const columns = ['Responsável', 'Pessoas', 'Inscrição', ...(area === 'registrations' ? ['Valor da inscrição', 'Pagamento'] : []), 'Entrada', 'Ação'];
  columns.forEach(title => { const th = el('th', title); th.scope = 'col'; header.append(th); }); $('table-head').append(header);
  const root = $('table-body'); root.replaceChildren(); const rows = filteredRows();
  $('result-count').textContent = rows.length + (rows.length === 1 ? ' inscrição encontrada' : ' inscrições encontradas');
  if (!rows.length) { const tr = el('tr'), td = el('td', 'Nenhuma inscrição encontrada.', 'empty'); td.colSpan = columns.length; tr.append(td); root.append(tr); }
  rows.forEach(r => {
    const active = r.status === 'REGISTERED', guaranteed = r.reservationStatus === 'CONFIRMED', tr = el('tr', undefined, guaranteed ? 'is-paid' : ''), name = el('td');
    name.append(el('strong', r.name), el('small', formatPhone(r.phone)), el('small', r.id)); tr.append(name, el('td', String(r.people)));
    const registration = el('td'); registration.append(el('span', reservationText(r.reservationStatus), 'status' + (guaranteed ? ' paid' : '')));
    if (r.reportedAt) registration.append(el('small', 'Participante abriu contato com a secretaria'));
    tr.append(registration); if (area === 'registrations') { const financial = el('td'); financial.append(el('strong', paymentText(r.paymentStatus))); financial.append(el('small',r.payment.planLabel+' · Recebido: '+money(r.payment.received)+' · Saldo: '+money(r.payment.balance)));
      r.payment.parts.forEach(p=>financial.append(el('small','Parcela '+p.number+'/'+r.payment.parts.length+' · '+dueLabel_(p.dueDate)+' · '+money(p.amount)+' · '+paymentText(p.status)+(p.method?' · '+(p.method==='PIX'?'Pix':'Depósito'):''))));
      if (r.proofSubmittedAt) financial.append(el('small', 'Comprovante: ' + dateTime(r.proofSubmittedAt))); if (r.paidAt) financial.append(el('small', 'Conferido: ' + dateTime(r.paidAt))); if (r.proofRejected) financial.append(el('small', 'Comprovante recusado; aguarda novo envio')); tr.append(el('td', money(r.total)), financial); }
    const entry = el('td'); entry.append(el('span', r.entryAt ? 'Confirmada' : !active ? 'Não autorizada' : r.reservationStatus === 'EXPIRED' ? 'Reserva expirada' : r.paymentStatus !== 'PAID' ? 'Aguarda quitação' : 'Aguardando chegada')); if (r.entryAt) entry.append(el('small', dateTime(r.entryAt))); tr.append(entry);
    const actions = el('td');
    if (area === 'registrations') {
      r.payment.parts.filter(p=>p.hasProof && p.number===p.proofGroup[0]).forEach(p=>{
        const suffix=r.payment.parts.length===1?'':' · '+p.proofGroup.join(' e '), downloaded=proofViewed.has(r.id+':'+p.number);
        let button=actionButton('BAIXAR COMPROVANTE'+suffix,()=>viewProof(r,p,button));actions.append(button,el('br'));
        if(active && p.status==='PROOF_SUBMITTED'){
          let confirm=actionButton('CONFIRMAR RECEBIMENTO'+suffix,()=>confirmReceipt(r,p,confirm),!downloaded);
          confirm.title=downloaded?'Confirma o recebimento desta parcela.':'Baixe e confira o comprovante antes de confirmar.';
          actions.append(confirm,el('br'));
          const more=el('details'),summary=el('summary','Outras ações'+suffix);
          more.append(summary,actionButton('RECUSAR COMPROVANTE'+suffix,()=>openPayment(r,p),!downloaded));actions.append(more);
        }
      });
      actions.append(guaranteeControl(r));
      actions.append(actionButton(active ? 'CANCELAR INSCRIÇÃO' : 'REATIVAR INSCRIÇÃO', () => openDialog(r), Boolean(r.entryAt)));
      actions.append(el('br'), actionButton('Histórico', () => openAudit(r)));
    } else if (!active) actions.append(el('span', 'INSCRIÇÃO CANCELADA', 'small muted'));
    else if (r.entryAt) actions.append(el('span', 'ENTRADA REGISTRADA', 'small muted'));
    else if (r.paymentStatus !== 'PAID') actions.append(el('span', 'AGUARDA PAGAMENTO CONFIRMADO', 'small muted'));
    else actions.append(actionButton('CONFIRMAR ENTRADA', () => confirmEntry(r, actions.firstChild)));
    tr.append(actions); root.append(tr);
  });
}
function guaranteeControl(row){
  const box=el('div',undefined,'guarantee-control'),label=el('label',undefined,'guarantee-check'),check=el('input'),help=el('small');
  check.type='checkbox';check.checked=row.reservationStatus==='CONFIRMED';check.disabled=row.status!=='REGISTERED';
  help.id='guarantee-help-'+row.id;check.setAttribute('aria-describedby',help.id);
  help.textContent=row.status!=='REGISTERED'?'Inscrição cancelada.':check.checked?'Vaga garantida pela organização. Pode desmarcar.':'Marque para garantir a vaga, inclusive sem comprovante.';
  check.onchange=()=>{const confirmed=check.checked;check.checked=!confirmed;changeReservation(row,confirmed,check);};
  label.append(check,el('span','CONFIRMAR'));box.append(label,help);return box;
}
async function changeReservation(row,confirmed,check){
  await busy(check,async()=>{message('admin-error','');try{
    const updated=await api('reservation',{id:row.id,confirmed,version:row.reservationVersion});
    state.rows=state.rows.map(r=>r.id===updated.id?updated:r);renderTable();
    message('admin-success',confirmed?'Vaga garantida.':'Garantia desmarcada. A inscrição segue as regras de reserva e prazo.',true);await load();
  }catch(error){await load();message('admin-error',error.message);}});
}
async function load() {
  message('admin-error', '');
  try { state = await api('list'); renderMetrics(); renderTable(); renderReminders(); $('updated-at').textContent = 'Dados atualizados em ' + dateTime(new Date().toISOString()) + ' (Brasília). Pix ou depósito. A caixa CONFIRMAR controla a garantia da vaga, independentemente do pagamento. A entrada exige quitação.'; }
  catch (e) { message('admin-error', e.message); $('result-count').textContent = 'Não foi possível carregar a lista.'; }
}
$('reload').onclick = () => busy($('reload'), load);
for (const id of ['search', 'registration-filter', 'entry-filter', 'payment-filter']) $(id).addEventListener(id === 'search' ? 'input' : 'change', renderTable);
function openDialog(row) {
  pendingAction = 'cancel'; $('submit-action').textContent = 'CONFIRMAR'; pendingRow = row; $('action-note').value = ''; message('dialog-error', '');
  $('dialog-title').textContent = row.status === 'REGISTERED' ? 'Cancelar esta inscrição?' : 'Reativar esta inscrição?';
  $('dialog-description').textContent = row.name + ' · ' + row.people + ' pessoa(s)';
  $('note-label').textContent = 'Motivo obrigatório';
  $('dialog-help').textContent = row.status === 'REGISTERED' ? 'O cancelamento libera os lugares e preserva o histórico. Esta ação não faz devolução financeira.' : 'A reativação exige vagas para todos os participantes e ficará registrada no histórico.';
  $('payment-decision-field')?.remove(); $('action-dialog').showModal();
}
async function viewProof(row, part, button) {
  await busy(button, async () => { try {
    const proof = await api('getProof', { id: row.id, part:part.number }), bytes = Uint8Array.from(atob(proof.data), c => c.charCodeAt(0));
    download(proof.name, bytes, proof.mime); proofViewed.set(row.id+':'+part.number, proof.version);
    message('admin-success', 'Comprovante baixado. Confira o valor e o recebimento na conta da igreja; depois marque a vaga ou confirme a parcela.', true); renderTable();
  } catch (e) { message('admin-error', e.message); } });
}
// Confirmação normal após o download: um clique, com conta e data no histórico.
async function confirmReceipt(row,part,button){
  await busy(button,async()=>{message('admin-error','');try{
    const version=proofViewed.get(row.id+':'+part.number);
    if(!version)throw new Error('Baixe e confira o comprovante antes de confirmar.');
    await api('payment',{id:row.id,part:part.number,approved:true,proofVersion:version,note:'Comprovante e recebimento conferidos na conta da igreja; confirmação registrada no painel.'});
    message('admin-success','Recebimento registrado e saldo atualizado. A garantia da vaga é controlada pela caixa CONFIRMAR.',true);await load();
  }catch(error){proofViewed.delete(row.id+':'+part.number);renderTable();message('admin-error',error.message);}});
}
function openPayment(row, part) {
  openDialog(row); pendingAction = 'payment'; pendingPart = part; $('dialog-title').textContent = 'Recusar comprovante';
  $('dialog-description').textContent = row.name+' · Parcelas '+part.proofGroup.join(' e ')+' · '+money(row.payment.parts.filter(p=>part.proofGroup.includes(p.number)).reduce((sum,p)=>sum+p.amount,0));
  $('dialog-help').textContent = 'Informe a divergência encontrada. A recusa permite que o participante envie outro comprovante e fica registrada no histórico.';
  $('submit-action').textContent = 'RECUSAR COMPROVANTE';
}
$('cancel-dialog').onclick = () => $('action-dialog').close();
$('action-form').onsubmit = e => {
  e.preventDefault(); busy($('submit-action'), async () => {
    message('dialog-error', '');
    try {
      if (pendingAction === 'payment' && !proofViewed.has(pendingRow.id+':'+pendingPart.number)) throw new Error('Baixe e confira o comprovante antes de confirmar ou recusar.');
      await api(pendingAction, pendingAction === 'payment' ? { id: pendingRow.id, part:pendingPart.number, approved: false, proofVersion: proofViewed.get(pendingRow.id+':'+pendingPart.number), note: $('action-note').value } : { id: pendingRow.id, cancelled: pendingRow.status === 'REGISTERED', note: $('action-note').value });
      $('action-dialog').close(); message('admin-success', 'Inscrição atualizada e vagas recalculadas. Alteração registrada no histórico.', true); await load();
    } catch (e) { message('dialog-error', e.message); }
  });
};
async function confirmEntry(row, button) {
  await busy(button, async () => {
    message('admin-error', '');
    try { await api('entry', { id: row.id }); message('admin-success', 'Entrada confirmada: ' + row.name + ' · ' + row.people + ' pessoa(s).', true); await load(); }
    catch (e) { await load(); message('admin-error', e.message); }
  });
}
function openAudit(row) {
  const root = $('audit-content'); root.replaceChildren(el('h3', row.name), el('p', row.id, 'small muted'));
  const audit = el('div', undefined, 'audit');
  const labels = { RESERVATION_CONFIRMED:'Vaga garantida manualmente', RESERVATION_RELEASED:'Garantia da vaga desmarcada', PAYMENT_PLAN_SELECTED:'Condição de pagamento escolhida', PAYMENT_DUE_DATE_UPDATED:'Vencimento do pagamento atualizado', REMINDER_OPENED:'Conversa de lembrete aberta', REMINDERS_ENABLED:'Lembretes autorizados', REMINDERS_DISABLED:'Lembretes cancelados', PROOF_SUBMITTED: 'Comprovante enviado', PROOF_REJECTED: 'Comprovante recusado', REGISTRATION_CANCELLED: 'Inscrição cancelada', REGISTRATION_RESTORED: 'Inscrição reativada', ENTRY_CONFIRMED: 'Entrada confirmada', PAYMENT_CONFIRMED: 'Pagamento confirmado', PAYMENT_REVERSED: 'Pagamento desfeito (histórico anterior)', ENTRY_OVERRIDE: 'Liberação excepcional (histórico anterior)' };
  if (!row.audit?.length) audit.append(el('p', 'Nenhuma alteração registrada.'));
  (row.audit || []).forEach(a => audit.append(el('p', (labels[a.action] || a.action) + '\n' + dateTime(a.at) + ' · ' + a.by + (a.note ? '\n' + a.note : ''))));
  audit.style.whiteSpace = 'pre-wrap'; root.append(audit); $('audit-dialog').showModal();
}
$('close-audit').onclick = () => $('audit-dialog').close();
function csvCell(v) { let s = String(v ?? ''); if (/^[\s]*[=+@\-\t\r\n]/.test(s)) s = "'" + s; return '"' + s.replaceAll('"', '""') + '"'; }
$('export').onclick = () => {
  const full = area === 'registrations';
  const header = ['Inscrição', 'Responsável', 'WhatsApp', 'Pessoas', 'Situação da inscrição', ...(full ? ['Valor da inscrição (R$)', 'Situação da reserva', 'Pagamento', 'Condição', 'Recebido (R$)', 'Saldo (R$)', 'Comprovante enviado em', 'Pagamento confirmado em', 'Conferido por', 'Contato aberto em', ...CONFIG.event.categories.map(c => c.label)] : []), 'Entrada em'];
  const rows = filteredRows().map(r => [r.id, r.name, r.phone, r.people, r.status === 'REGISTERED' ? 'Registrada' : 'Cancelada', ...(full ? [(r.total / 100).toFixed(2).replace('.', ','), reservationText(r.reservationStatus), paymentText(r.paymentStatus), r.payment.planLabel, (r.payment.received/100).toFixed(2).replace('.',','), (r.payment.balance/100).toFixed(2).replace('.',','), dateTime(r.proofSubmittedAt), dateTime(r.paidAt), r.paidBy, dateTime(r.reportedAt), ...CONFIG.event.categories.map(c => r.counts[c.key])] : []), dateTime(r.entryAt)]);
  download('ceia-ipdiv-' + area + '.csv', '\uFEFF' + [header, ...rows].map(r => r.map(csvCell).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
};
function renderReminders(){
  $('reminders-panel').hidden=state.actor.role==='door';const root=$('reminders-list');root.replaceChildren();
  if(!state.reminders?.length){root.append(el('p','Nenhum pagamento com lembrete autorizado para amanhã.','small'));return;}
  state.reminders.forEach(item=>{const line=el('div',undefined,'reminder-row');line.append(el('strong',item.name),el('p',(item.count===1?'À vista':'Parcela '+item.number+'/'+item.count)+' · '+money(item.amount)+' · '+dueLabel_(item.dueDate),'small'));
    const link=el('a','ABRIR WHATSAPP','btn secondary');link.href=item.url;link.target='_blank';link.rel='noopener noreferrer';link.onclick=()=>{api('reminderOpened',{id:item.id,part:item.number}).then(()=>message('admin-success','Conversa aberta. Confira a mensagem e toque em Enviar; o sistema não confirma entrega.',true)).catch(e=>message('admin-error',e.message));};line.append(link);
    if(item.openedAt)line.append(el('small','Conversa já aberta em '+dateTime(item.openedAt)+'; envio não comprovado.'));root.append(line);});
}
$('export-parts').onclick=()=>{
  const header=['Inscrição','Responsável','WhatsApp','Condição','Parcela','Vencimento','Valor (R$)','Situação','Forma','Comprovante enviado em','Confirmado em','Conferido por'];
  const rows=filteredRows().flatMap(r=>r.payment.parts.map(p=>[r.id,r.name,r.phone,r.payment.planLabel,p.number+'/'+r.payment.parts.length,dueLabel_(p.dueDate),(p.amount/100).toFixed(2).replace('.',','),paymentText(p.status),p.method==='PIX'?'Pix':p.method==='DEPOSIT'?'Depósito':'',dateTime(p.proofSubmittedAt),dateTime(p.paidAt),p.paidBy]));
  download('ceia-ipdiv-parcelas.csv','\uFEFF'+[header,...rows].map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8');
};
$('print-list').onclick = () => window.print();
setArea(area); load();
</script>
