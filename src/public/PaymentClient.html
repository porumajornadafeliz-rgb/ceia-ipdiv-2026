<script>
function paymentPlanLabel(plan) { const values=plan.parts.map(p=>p.amount);return values.length===1?'À vista · '+money(values[0]):values.every(v=>v===values[0])?values.length+'x de '+money(values[0]):values.length+'x · '+values.map(money).join(' + '); }
async function proofPayload(file) {
  if (!file || !file.size || file.size > 2097152) throw new Error('Selecione um comprovante em PDF, JPG ou PNG de até 2 MB.');
  const known = ['application/pdf','image/png','image/jpeg'];
  const mime = known.includes(file.type) ? file.type : /\.pdf$/i.test(file.name) ? 'application/pdf' : /\.png$/i.test(file.name) ? 'image/png' : /\.jpe?g$/i.test(file.name) ? 'image/jpeg' : '';
  if (!mime) throw new Error('Use um arquivo PDF, JPG ou PNG.');
  const data = await new Promise((resolve,reject) => { const reader=new FileReader(); reader.onload=()=>resolve(String(reader.result).split(',')[1]); reader.onerror=()=>reject(new Error('Não foi possível ler o arquivo.')); reader.readAsDataURL(file); });
  return {data,mime};
}
// A conversa é aberta por gesto do participante. O WhatsApp ainda exige tocar em Enviar.
function prepareProofConversation(){
  if(window.CEIA_DEMO)return null;
  try{const conversation=window.open('about:blank','_blank');if(conversation){conversation.opener=null;conversation.document.title='Preparando mensagem para a secretaria';conversation.document.body.textContent='Salvando o comprovante. A conversa com a secretaria será aberta após o envio.';}return conversation;}catch{return null;}
}
function openProofConversation(conversation,data,root,credentials){
  if(window.CEIA_DEMO)return;
  const href=secretariatWhatsAppLink(data),note=el('p','Comprovante salvo no sistema. No WhatsApp, confira a mensagem e toque em Enviar. Se a conversa não abrir, use o botão abaixo.','small');
  const link=el('a','ABRIR MENSAGEM PARA A SECRETARIA','btn secondary full');link.classList.add('proof-whatsapp-link');link.href=href;link.target='_blank';link.rel='noopener noreferrer';root.append(note,link);
  let opened=false;try{if(conversation && !conversation.closed){conversation.location.replace(href);opened=true;}}catch{try{conversation?.close();}catch{}}
  // Apenas registra abertura; não declara que a mensagem foi enviada ou entregue.
  if(opened && credentials.token)api('report',credentials).catch(()=>{});
}
function proofSuccessText(data){return data.reservationStatus==='CONFIRMED'?'Comprovante recebido. Suas vagas estão garantidas. O pagamento continua em conferência.':'Comprovante recebido. Aguarde a conferência da secretaria para garantir as vagas.';}
function drawPaymentPanel(root,data,credentials,onUpdate,main=false) {
  const signature=JSON.stringify([data.status,data.reservationStatus,data.canChangePlan,data.paymentStatus,data.payment,data.paymentOptions,data.remindersEnabled]);
  if(root.dataset.state===signature && root.querySelector('[data-plan-chooser]')) return true;
  const previousFile=root.querySelector('input[type=file]');
  if(previousFile?.files.length && root.dataset.state===signature) return false;
  root.dataset.state=signature;root.replaceChildren();
  const payment=data.payment, options=data.paymentOptions || [], active=data.status!=='CANCELLED' && data.reservationStatus!=='CANCELLED' && data.reservationStatus!=='EXPIRED';
  const choiceKey='ceia-payment-choice:'+data.id;
  if(!root.dataset.chosenPlan){try{root.dataset.chosenPlan=sessionStorage.getItem(choiceKey)||'';}catch{}}
  if(data.canChangePlan && root.dataset.chosenPlan!==data.id+':'+payment.plan){
    const chooser=el('div');chooser.setAttribute('data-plan-chooser','');
    const field=el('div',undefined,'field'),label=el('label','Condição de pagamento'),select=el('select');select.id=main?'payment-plan':'plan-'+data.id;label.htmlFor=select.id;
    const placeholder=el('option','Escolha uma opção');placeholder.value='';placeholder.disabled=true;select.append(placeholder);
    const plans=availableSchedules_(data.total,Date.now(),'COLLECT_OVERDUE');
    plans.forEach(plan=>{const option=el('option',plan.key==='ONCE'?'À vista':plan.parts.length+'x');option.value=plan.key;select.append(option);});select.value='';
    const preview=el('div',undefined,'payment-plan-preview');preview.hidden=true;preview.setAttribute('aria-live','polite');
    const error=el('p','', 'payment-proof-note');error.hidden=true;error.setAttribute('role','alert');
    const choose=el('button','CONTINUAR PARA PAGAMENTO','btn full');choose.id=main?'choose-payment-plan':'choose-plan-'+data.id;choose.type='button';choose.disabled=true;
    field.append(label,select);chooser.append(field,preview,error,choose);root.append(chooser);
    select.onchange=()=>{
      const plan=plans.find(p=>p.key===select.value);preview.replaceChildren();preview.hidden=!plan;choose.disabled=!plan;
      if(!plan)return;
      preview.append(el('p',paymentPlanLabel(plan),'payment-amount'));
      plan.parts.forEach(part=>preview.append(el('p',(plan.parts.length===1?'Pague até ':part.number+'ª parcela · '+money(part.amount)+' · ')+dueLabel_(part.dueDate),'small')));
      const overdue=plan.parts.filter(p=>p.dueDate<=brasiliaDay_());
      if(overdue.length>1)preview.append(el('p','Parcelas vencidas: '+money(overdue.reduce((sum,p)=>sum+p.amount,0))+' para pagar agora.','small'));
    };
    choose.onclick=async()=>{
      select.disabled=true;choose.disabled=true;error.hidden=true;
      try{
        const updated=await api('paymentPlan',{...credentials,plan:select.value});
        root.dataset.chosenPlan=data.id+':'+updated.payment.plan;
        try{sessionStorage.setItem(choiceKey,root.dataset.chosenPlan);}catch{}
        root.dataset.state='';await onUpdate(updated);
      }catch(problem){error.textContent=problem.message;error.hidden=false;select.disabled=false;choose.disabled=false;}
    };
    return true;
  }
  const overview=el('div',undefined,'installment-overview');
  overview.append(el('h3',payment.plan==='LEGACY'?'À vista':payment.parts.length===1?'À vista':payment.parts.length+'x'));
  if(payment.received)overview.append(el('p','Total: '+money(data.total)+' · Recebido: '+money(payment.received)+' · Falta: '+money(payment.balance),'small'));
  if(payment.parts.length>1){
    const details=el('details'),summary=el('summary','Ver parcelas e vencimentos');details.append(summary);
    payment.parts.forEach(p=>{const line=el('div',undefined,'installment-row');line.append(el('strong','Parcela '+p.number+'/'+payment.parts.length+' · '+money(p.amount)),el('span',dueLabel_(p.dueDate)),el('span',paymentText(p.status),'small'));details.append(line);});overview.append(details);
  }
  if(data.canChangePlan){
    const change=el('button','ALTERAR CONDIÇÃO DE PAGAMENTO','text-btn');change.type='button';change.onclick=()=>{root.dataset.chosenPlan='';root.dataset.state='';try{sessionStorage.removeItem(choiceKey);}catch{}onUpdate(data);};overview.append(change);
  }
  root.append(overview);
  const result=el('p','', 'payment-proof-note');result.hidden=true;result.setAttribute('role','status');root.append(result);
  let preference=null;
  if(data.remindersEnabled){const cancel=el('button','CANCELAR LEMBRETES POR WHATSAPP','text-btn full');cancel.type='button';cancel.onclick=()=>busy(cancel,async()=>{try{await onUpdate(await api('reminderPreference',{...credentials,enabled:false}));}catch(error){result.hidden=false;result.textContent=error.message;}});preference=cancel;}
  if(!active || payment.balance===0){if(preference)root.append(preference);return;}
  const pendingProof=payment.parts.some(p=>p.status==='PROOF_SUBMITTED');
  if(pendingProof){result.hidden=false;result.textContent=proofSuccessText(data)+' Não repita esse pagamento.';}
  if(!options.length){if(preference)root.append(preference);return;}
  const field=el('div',undefined,'field'),label=el('label','Pagamento que deseja realizar'),selection=el('select');selection.id=main?'payment-group':'group-'+data.id;label.htmlFor=selection.id;
  if(pendingProof){const blank=el('option','Escolher outro pagamento (opcional)');blank.value='';selection.append(blank);}
  options.forEach((group,i)=>{const past=group.parts.length>1 || group.dueDate < brasiliaDay_();const o=el('option',(payment.parts.length===1?'À vista':group.parts.length>1?'Parcelas '+group.parts.join(' e '):'Parcela '+group.parts[0]+'/'+payment.parts.length)+' · '+money(group.amount)+(past?' · pagar agora':' · '+dueLabel_(group.dueDate)));o.value=String(i);selection.append(o);});
  field.append(label,selection);if(options.length>1 || pendingProof)root.append(field);
  const controls=el('div');root.append(controls);if(preference)root.append(preference);
  function renderOption(){
    controls.replaceChildren(); if(selection.value==='')return;
    const group=options[Number(selection.value)],methodField=el('div',undefined,'field'),methodLabel=el('label','Forma de pagamento'),method=el('select');method.id=main?'payment-method':'method-'+data.id;methodLabel.htmlFor=method.id;
    [['PIX','Pix'],['DEPOSIT','Depósito em conta']].forEach(([v,t])=>{const o=el('option',t);o.value=v;method.append(o);});methodField.append(methodLabel,method);controls.append(el('p',payment.parts.length===1?'Valor à vista':group.parts.length>1?'Valor das parcelas '+group.parts.join(' e '):'Valor da parcela '+group.parts[0]+'/'+payment.parts.length,'small muted'),el('p',money(group.amount),'payment-amount'),el('p','Vencimento: '+dueLabel_(group.dueDate),'small'),methodField);
    const pix=el('section');pix.id=main?'pix-section':'pix-'+data.id;pix.className='payment-choice';const qrRoot=el('div',undefined,'qr');qrRoot.id=main?'qr':'qr-'+data.id;
    const qr=qrcode(0,'M');qr.addData(group.pix,'Byte');qr.make();qrRoot.innerHTML=qr.createSvgTag({cellSize:4,margin:16,scalable:true});
    const code=el('textarea');code.readOnly=true;code.className='pix-code';code.value=group.pix;code.id=main?'pix-code':'pix-code-'+data.id;code.setAttribute('aria-label','Pix Copia e Cola desta inscrição');
    const copy=el('button','COPIAR PIX COPIA E COLA','btn full');copy.type='button';copy.id=main?'copy-pix':'copy-'+data.id;copy.onclick=()=>copyText(group.pix,copy);
    const key=el('button','COPIAR CHAVE PIX','btn secondary full');key.type='button';key.id=main?'copy-key':'key-'+data.id;key.onclick=()=>copyText('20896270000130',key);
    pix.append(el('h3','Pague com Pix'),el('p','Escaneie o QR Code ou use o Pix Copia e Cola no aplicativo do seu banco.','small'),qrRoot,el('p','Chave CNPJ: 20.896.270/0001-30','small'),key,copy,code);controls.append(pix);
    const bank=el('div',undefined,'notice bank-details');bank.append(el('strong','Confira o favorecido antes de pagar:'),el('p','Igreja Presbiteriana de Divinópolis · CNPJ 20.896.270/0001-30'),el('p','Itaú · Agência 0690 · Conta corrente 16.405-8'),el('p','Se já pagou, não repita o pagamento. Envie o comprovante abaixo.'));controls.append(bank);
    method.onchange=()=>{pix.hidden=method.value==='DEPOSIT';};
    const proof=el('section');proof.id=main?'proof-section':'proof-'+data.id;proof.className='payment-choice';proof.append(el('h3','Já pagou? Envie o comprovante'),el('p','Envio obrigatório: PDF, JPG ou PNG de até 2 MB. A secretaria confere o recebimento e confirma as vagas após a primeira parcela. Após salvar, abriremos a mensagem para a secretaria no WhatsApp.','small'));
    const file=el('input');file.type='file';file.accept='application/pdf,image/png,image/jpeg';file.id=main?'proof-file':'file-'+data.id;const fileLabel=el('label',main?'Comprovante de pagamento':'Comprovante desta inscrição');fileLabel.htmlFor=file.id;file.setAttribute('aria-label',main?'Comprovante de pagamento':'Comprovante desta inscrição');
    const upload=el('button',main?'ENVIAR COMPROVANTE PARA CONFERÊNCIA':'ENVIAR COMPROVANTE','btn full');upload.type='button';upload.id=main?'proof-button':'upload-'+data.id;proof.append(fileLabel,file,upload);controls.append(proof);
    upload.onclick=()=>busy(upload,async()=>{
      let conversation=null;
      try{
        const attachment=file.files[0];
        if(!attachment || !attachment.size || attachment.size>2097152)throw new Error('Selecione um comprovante em PDF, JPG ou PNG de até 2 MB.');
        conversation=prepareProofConversation();
        const payload=await proofPayload(attachment),updated=await api('proof',{...credentials,...payload,parts:group.parts,method:method.value});
        await onUpdate(updated);
        if(main)message('payment-success',proofSuccessText(updated),true);
        openProofConversation(conversation,updated,root,credentials);
      }catch(error){try{conversation?.close();}catch{}result.hidden=false;result.textContent=error.message;}
    });
  }
  selection.onchange=renderOption;renderOption();
}
</script>
