<script>
const counts = Object.fromEntries(CONFIG.event.categories.map(c => [c.key, 0]));
counts.adultMembers = 1;
function newRequestId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const bytes = crypto.getRandomValues(new Uint8Array(16)); bytes[6] = (bytes[6] & 15) | 64; bytes[8] = (bytes[8] & 63) | 128;
  const hex = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
  return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
}
let requestId = newRequestId(), draft = null, current = null, access = null;
let availability = null, capacityRequest = null;
function renderAvailability() {
  const c = availability;
  $('capacity-summary').textContent = !c ? 'Não foi possível consultar as vagas.' : !c.configured ? 'Limite de vagas em definição' : c.remaining === 0 ? 'Vagas esgotadas' : c.remaining + (c.remaining === 1 ? ' vaga restante' : ' vagas restantes');
  $('capacity-detail').textContent = c?.configured ? 'Limite de ' + c.limit + ' pessoas, incluindo crianças. As vagas são reservadas ao registrar a inscrição. Pagamento diretamente com a secretaria.' : 'Atualize a consulta antes de se inscrever. Se persistir, procure a secretaria.';
  $('begin').disabled = !CONFIG.open || !c?.configured || c.remaining === 0;
  $('begin').textContent = !CONFIG.open ? 'INSCRIÇÕES ENCERRADAS' : c?.configured && c.remaining === 0 ? 'VAGAS ESGOTADAS' : 'FAZER MINHA INSCRIÇÃO';
  renderCounts();
}
async function refreshCapacity() {
  if (capacityRequest) return capacityRequest;
  capacityRequest = (async () => {
    try { availability = await api('capacity'); $('capacity-updated').textContent = 'Consulta em ' + dateTime(new Date().toISOString()) + '. A disponibilidade pode mudar.'; }
    catch { availability = null; $('capacity-updated').textContent = 'Não foi possível atualizar. Confira sua conexão e tente novamente.'; }
    renderAvailability();
  })();
  try { await capacityRequest; } finally { capacityRequest = null; }
}
$('refresh-capacity').onclick = () => busy($('refresh-capacity'), refreshCapacity);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { refreshCapacity(); if (access) refreshRegistration(); } });
setInterval(() => { if (!document.hidden) { if (access && !$('payment-view').hidden) refreshRegistration(); else refreshCapacity(); } }, 30000);
installPhoneMask($('phone'));
const views = ['home', 'form', 'review', 'payment', 'lookup'];
function show(view) {
  views.forEach(v => $(v + '-view').hidden = v !== view);
  const title = $(view + '-title');
  if (title) { title.focus({ preventScroll: true }); title.scrollIntoView({ block: 'start' }); } else window.scrollTo(0, 0);
}
function sum() { return CONFIG.event.categories.reduce((s, c) => ({ people: s.people + counts[c.key], total: s.total + counts[c.key] * c.price }), { people: 0, total: 0 }); }
function summary(target, quantities) {
  const root = $(target); root.replaceChildren(); let total = 0, people = 0;
  CONFIG.event.categories.forEach(c => {
    const n = quantities[c.key]; if (!n) return;
    const line = el('div', undefined, 'summary-line'); line.append(el('span', n + ' × ' + c.label), el('strong', money(n * c.price))); root.append(line);
    total += n * c.price; people += n;
  });
  const family = el('div', undefined, 'summary-line'); family.append(el('span', 'Total de participantes'), el('strong', people + (people === 1 ? ' pessoa' : ' pessoas'))); root.append(family);
  const line = el('div', undefined, 'total'); line.append(el('span', 'Total geral'), el('strong', money(total))); root.append(line);
}
function renderCounts() {
  CONFIG.event.categories.forEach(c => {
    $('quantity-' + c.key).value = counts[c.key]; $('quantity-' + c.key).textContent = counts[c.key];
    $('minus-' + c.key).disabled = counts[c.key] === 0;
    $('plus-' + c.key).disabled = sum().people >= Math.min(100, availability?.configured ? availability.remaining : 100) || (c.key === 'spouse' && (!counts.adultMembers || counts.spouse >= 1));
  });
  summary('live-summary', counts);
}
CONFIG.event.categories.forEach(c => {
  const row = el('div', undefined, 'category'), description = el('div');
  description.append(el('span', c.label, 'category-label'), el('span', money(c.price) + ' por pessoa', 'category-price'));
  const counter = el('div', undefined, 'counter');
  const minus = el('button', '−'), plus = el('button', '+'), value = el('output', '0');
  value.id = 'quantity-' + c.key; value.setAttribute('aria-label', 'Quantidade: ' + c.label);
  for (const [button, delta, verb] of [[minus, -1, 'Diminuir'], [plus, 1, 'Aumentar']]) {
    button.type = 'button'; button.id = (delta < 0 ? 'minus-' : 'plus-') + c.key; button.setAttribute('aria-label', verb + ' ' + c.label.toLowerCase());
    button.addEventListener('click', () => {
      counts[c.key] = Math.max(0, counts[c.key] + delta);
      if (!counts.adultMembers && counts.spouse) { counts.spouse = 0; message('form-error', 'A tarifa de cônjuge foi removida porque exige um adulto membro.'); }
      else message('form-error', '');
      renderCounts();
    });
  }
  counter.append(minus, value, plus); row.append(description, counter); $('categories').append(row);
});
renderCounts();
if (!CONFIG.open) { $('begin').disabled = true; $('begin').textContent = 'INSCRIÇÕES ENCERRADAS'; $('deadline-home').textContent = 'O prazo encerrou em 20/12/2026. A consulta de pagamentos continua disponível.'; }
$('begin').onclick = () => { show('form'); refreshCapacity(); };
$('open-lookup').onclick = () => show('lookup');
$('brand-home').onclick = e => { e.preventDefault(); show('home'); };
$('registration-form').onsubmit = e => {
  e.preventDefault();
  busy($('review-button'), async () => {
    message('form-error', '');
    await refreshCapacity();
    if (!availability?.configured || sum().people > availability.remaining) { message('form-error', 'Não há vagas suficientes ou não foi possível consultar a disponibilidade. Confira o contador de vagas e ajuste os participantes.'); return; }
    if (!sum().people) { message('form-error', 'Inclua pelo menos uma pessoa na inscrição.'); return; }
    const phone = $('phone').value.replace(/\D/g, '');
    if (phone.length < 10 || phone.length > 13) { message('form-error', 'Confira o número de WhatsApp com DDD.'); return; }
    draft = { name: $('name').value.trim(), phone: $('phone').value, counts: { ...counts }, requestId };
    $('review-name').textContent = draft.name; $('review-phone').textContent = 'WhatsApp: ' + formatPhone(draft.phone);
    summary('review-summary', draft.counts); show('review');
  });
};
$('edit').onclick = () => show('form');
$('confirm').onclick = () => busy($('confirm'), async () => {
  message('review-error', ''); $('edit').disabled = true;
  try {
    try { sessionStorage.setItem('ceia-pending', JSON.stringify(draft)); } catch {}
    const result = await api('create', draft); access = { id: result.id, token: result.token };
    try { sessionStorage.removeItem('ceia-pending'); } catch {}
    updateHash(); renderPayment(result); show('payment'); await refreshCapacity();
  } catch (e) { message('review-error', e.message); await refreshCapacity(); } finally { $('edit').disabled = false; }
});
function baseUrl() { return (CONFIG.url || location.href.split('#')[0]).split('#')[0]; }
function privateLink() { return baseUrl() + '#' + new URLSearchParams(access).toString(); }
function updateHash() {
  try { sessionStorage.setItem('ceia-active', JSON.stringify(access)); } catch {}
  const hash = new URLSearchParams(access).toString();
  if (window.CEIA_DEMO) history.replaceState(null, '', '#' + hash);
  else google.script.history.replace({}, {}, hash);
}
function renderPayment(data) {
  current = data; const active = data.status === 'REGISTERED';
  $('payment-status').textContent = active ? 'INSCRIÇÃO REGISTRADA' : 'INSCRIÇÃO CANCELADA';
  $('payment-status').className = 'status' + (active ? ' paid' : '');
  $('payment-title').textContent = active ? 'Sua inscrição foi registrada!' : 'Esta inscrição foi cancelada.';
  $('payment-description').textContent = active ? 'Seus lugares já estão reservados. Guarde seu link e envie os dados para a secretaria.' : 'Os lugares foram liberados. Procure a secretaria se precisar de orientação.';
  $('registration-notice').textContent = active ? 'As vagas desta inscrição já estão contabilizadas.' : 'Esta inscrição não ocupa vagas e não autoriza a entrada.';
  $('registration-id').textContent = data.id; $('receipt-name').textContent = data.name; summary('receipt-summary', data.counts);
  $('private-link').value = privateLink();
  $('confirmed-section').hidden = !active;
  $('pix-section').hidden = !active || !data.pix;
  if (active && data.pix) {
    $('pix-code').value = data.pix;
    const qr = qrcode(0, 'M'); qr.addData(data.pix, 'Byte'); qr.make();
    $('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 16, scalable: true });
  } else { $('qr').replaceChildren(); $('pix-code').value = ''; }
  $('report-pix').href = secretariatWhatsAppLink(data);
  $('whatsapp-message-preview').textContent = secretariatMessage(data);
  $('reported-message').textContent = data.reportedAt ? 'Conversa preparada em ' + dateTime(data.reportedAt) + '. No WhatsApp, confira os dados e toque em Enviar. A secretaria fará o controle de pagamento.' : 'Abra o WhatsApp, confira os dados e toque em Enviar. Você pode anexar o comprovante na própria conversa com a secretaria.';
}
$('copy-pix').onclick = () => { if (current?.pix) copyText(current.pix, $('copy-pix')); };
$('copy-link').onclick = () => { if (access) copyText(privateLink(), $('copy-link')); };
function secretariatMessage(data) {
  const categories = CONFIG.event.categories.filter(c => data.counts[c.key]).map(c => data.counts[c.key] + ' × ' + c.label).join('\n');
  return 'Olá, secretaria! Seguem os dados da minha inscrição para a Ceia de Confraternização IPDiv 2026:\n\nResponsável: ' + data.name + '\nWhatsApp: ' + formatPhone(data.phone) + '\nInscrição: ' + data.id + '\nParticipantes: ' + data.people + '\n' + categories + '\nValor da inscrição: ' + money(data.total) + '\n\nSituação: ' + (data.status === 'REGISTERED' ? 'INSCRIÇÃO REGISTRADA — vagas já contabilizadas.' : 'INSCRIÇÃO CANCELADA — vagas liberadas.') + '\nPagamento: controle diretamente com a secretaria. Esta mensagem não é comprovante de pagamento.';
}
function secretariatWhatsAppLink(data) {
  const text = secretariatMessage(data);
  return 'https://wa.me/' + CONFIG.event.secretariat.whatsapp + '?text=' + encodeURIComponent(text);
}
$('report-pix').onclick = () => {
  message('payment-error', '');
  // Abertura da conversa não prova envio, entrega ou pagamento; as vagas já foram reservadas no cadastro.
  api('report', access).then(data => {
    renderPayment(data);
    message('payment-success', data.status === 'REGISTERED' ? 'Confira os dados no WhatsApp e toque em Enviar. As vagas desta inscrição já estão contabilizadas.' : 'Inscrição cancelada. Confira a mensagem no WhatsApp para falar com a secretaria.', true);
  }).catch(e => message('payment-error', 'O WhatsApp continua disponível, mas não foi possível registrar a abertura da conversa. ' + e.message));
};
let registrationRequest = null;
async function refreshRegistration(announce = false) {
  if (!access || registrationRequest) return registrationRequest;
  registrationRequest = (async () => {
    try { renderPayment(await api('lookup', access)); await refreshCapacity(); if (announce) message('payment-success', 'Inscrição atualizada.', true); }
    catch (e) { if (announce) message('payment-error', e.message); }
  })();
  try { await registrationRequest; } finally { registrationRequest = null; }
}
$('refresh-payment').onclick = () => busy($('refresh-payment'), async () => { message('payment-error', ''); message('payment-success', ''); await refreshRegistration(true); });
function receiptText() {
  return 'CEIA DE CONFRATERNIZAÇÃO 2026\nIgreja Presbiteriana de Divinópolis\n\nInscrição: ' + current.id + '\nResponsável: ' + current.name + '\nParticipantes: ' + current.people + '\nValor da inscrição: ' + money(current.total) + '\n' + (current.status === 'REGISTERED' ? 'INSCRIÇÃO REGISTRADA' : 'INSCRIÇÃO CANCELADA') + '\nRegistro em: ' + dateTime(current.createdAt) + '\nControle de pagamento diretamente com a secretaria. Não é comprovante de pagamento.\n\n' + CONFIG.event.date + ' — ' + CONFIG.event.thanksgiving.name + ' às ' + CONFIG.event.thanksgiving.time + '\n' + CONFIG.event.thanksgiving.venue + ' — ' + CONFIG.event.thanksgiving.address + '\n\nCeia após o culto — ' + CONFIG.event.venue + '\n' + CONFIG.event.address + '\n\nConsulta privada: ' + privateLink();
}
$('save-receipt').onclick = () => download(current.id + '.txt', receiptText(), 'text/plain;charset=utf-8');
$('print-receipt').onclick = () => window.print();
$('share-receipt').onclick = async () => {
  const text = receiptText();
  try { if (navigator.share) await navigator.share({ title: CONFIG.event.name, text }); else await copyText(text, $('share-receipt')); }
  catch (e) { if (e.name !== 'AbortError') await copyText(text, $('share-receipt')); }
};
function parseAccess(raw) {
  const hash = raw.includes('#') ? raw.slice(raw.indexOf('#') + 1) : raw.replace(/^#/, ''); const params = new URLSearchParams(hash);
  const id = params.get('id'), token = params.get('token');
  if (!/^IPD26[A-F0-9]{16}$/.test(id || '') || !/^[a-zA-Z0-9_-]{43}$/.test(token || '')) throw new Error('Cole o link individual completo, incluindo a parte depois de #.');
  return { id, token };
}
async function loadAccess(raw) { access = parseAccess(raw); const result = await api('lookup', access); renderPayment(result); updateHash(); show('payment'); await refreshCapacity(); }
$('lookup-form').onsubmit = e => { e.preventDefault(); busy($('lookup-button'), async () => { message('lookup-error', ''); try { await loadAccess($('lookup-link').value); } catch (e) { message('lookup-error', e.message); } }); };
async function initialLocation(hash) {
  if (hash && /(?:^#?|&)id=/.test(hash)) { show('lookup'); try { await loadAccess(hash); } catch (e) { message('lookup-error', e.message); } return; }
  try {
    const active = JSON.parse(sessionStorage.getItem('ceia-active'));
    if (active) { await loadAccess(new URLSearchParams(active).toString()); return; }
    const pending = JSON.parse(sessionStorage.getItem('ceia-pending'));
    if (pending && CONFIG.open) {
      requestId = pending.requestId; $('name').value = pending.name; $('phone').value = formatPhone(pending.phone);
      CONFIG.event.categories.forEach(c => counts[c.key] = pending.counts[c.key] || 0); renderCounts(); show('form');
      message('form-error', 'Recuperamos seu último envio nesta aba. Confira os dados e tente registrar novamente; ele não será duplicado.');
    }
  } catch {}
}
if (window.CEIA_DEMO) initialLocation(location.hash);
else google.script.url.getLocation(loc => initialLocation(loc.hash || ''));
refreshCapacity();
</script>
