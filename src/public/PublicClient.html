<script>
const counts = Object.fromEntries(CONFIG.event.categories.map(c => [c.key, 0]));
counts.adultMembers = 1;
function newRequestId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const bytes = crypto.getRandomValues(new Uint8Array(16)); bytes[6] = (bytes[6] & 15) | 64; bytes[8] = (bytes[8] & 63) | 128;
  const hex = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
  return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
}
let requestId = newRequestId(), draft = null, current = null, access = null;
let availability = null, capacityRequest = null;
function renderAvailability() {
  const c = availability;
  $('capacity-summary').textContent = !c ? 'Não foi possível consultar as vagas.' : !c.configured ? 'Limite de vagas em definição' : c.remaining === 0 ? 'Vagas esgotadas' : c.remaining + (c.remaining === 1 ? ' vaga restante' : ' vagas restantes');
  $('capacity-detail').textContent = c?.configured ? 'Limite de ' + c.limit + ' pessoas, incluindo crianças. O cadastro reserva lugares até 20/12/2026. A primeira parcela confirmada garante as vagas.' : 'Atualize a consulta antes de se inscrever. Se persistir, procure a secretaria.';
  $('begin').disabled = !CONFIG.open || !c?.configured || c.remaining === 0;
  $('begin').textContent = !CONFIG.open ? 'INSCRIÇÕES ENCERRADAS' : c?.configured && c.remaining === 0 ? 'VAGAS ESGOTADAS' : 'FAZER MINHA INSCRIÇÃO';
  renderCounts();
}

    catch { availability = null; $('capacity-updated').textContent = 'Não foi possível atualizar. Confira sua conexão e tente novamente.'; }

  try { await capacityRequest; } finally { capacityRequest = null; }
}
$('refresh-capacity').onclick = () => busy($('refresh-capacity'), refreshCapacity);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { refreshCapacity(); if (access) refreshRegistration(); } });
setInterval(() => { if (!document.hidden) { if (access && !$('payment-view').hidden) refreshRegistration(); else refreshCapacity(); } }, 30000);
installPhoneMask($('phone'));
installPhoneMask($('status-phone'));
const views = ['home', 'form', 'review', 'payment', 'lookup'];
function show(view) {

function sum() { return CONFIG.event.categories.reduce((s, c) => ({ people: s.people + counts[c.key], total: s.total + counts[c.key] * c.price }), { people: 0, total: 0 }); }
function summary(target, quantities) {
  const root = $(target); root.replaceChildren(); let total = 0, people = 0;
  CONFIG.event.categories.forEach(c => {
    const n = quantities[c.key]; if (!n) return;
    const line = el('div', undefined, 'summary-line'); line.append(el('span', n + ' × ' + c.label), el('strong', money(n * c.price))); root.append(line);
    total += n * c.price; people += n;
  });
  const family = el('div', undefined, 'summary-line'); family.append(el('span', 'Total de participantes'), el('strong', people + (people === 1 ? ' pessoa' : ' pessoas'))); root.append(family);
  const line = el('div', undefined, 'total'); line.append(el('span', 'Total geral'), el('strong', money(total))); root.append(line);
}
function renderCounts() {
  CONFIG.event.categories.forEach(c => {
    $('quantity-' + c.key).value = counts[c.key]; $('quantity-' + c.key).textContent = counts[c.key];
    $('minus-' + c.key).disabled = counts[c.key] === 0;

}
CONFIG.event.categories.forEach(c => {

  const counter = el('div', undefined, 'counter');

  value.id = 'quantity-' + c.key; value.setAttribute('aria-label', 'Quantidade: ' + c.label);
  for (const [button, delta, verb] of [[minus, -1, 'Diminuir'], [plus, 1, 'Aumentar']]) {
    button.type = 'button'; button.id = (delta < 0 ? 'minus-' : 'plus-') + c.key; button.setAttribute('aria-label', verb + ' ' + c.label.toLowerCase());
    button.addEventListener('click', () => {
      counts[c.key] = Math.max(0, counts[c.key] + delta);

});
renderCounts();

    draft.plan = draft.plan || 'ONCE'; draft.remindersEnabled = $('reminder-consent').checked;

$('confirm').onclick = () => submitRegistration($('confirm'));
$('reserve-later').onclick = () => submitRegistration($('reserve-later'));
function baseUrl() { return (CONFIG.url || location.href.split('#')[0]).split('#')[0]; }
function privateLink() { return baseUrl() + '#' + new URLSearchParams(access).toString(); }
function updateHash() {

  const hash = new URLSearchParams(access).toString();

function renderPayment(data) {
  const previousStatus=current?.paymentStatus;if(previousStatus && previousStatus!==data.paymentStatus)message('payment-success','');
  current=data;const active=data.status==='REGISTERED',paid=data.paymentStatus==='PAID',guaranteed=data.reservationStatus==='CONFIRMED',awaiting=data.paymentStatus==='PROOF_SUBMITTED';
  $('payment-status').textContent=reservationText(data.reservationStatus);$('payment-status').className='status'+(guaranteed?' paid':'');
  $('financial-status').textContent=paymentText(data.paymentStatus);
  $('payment-title').textContent=!active?'Esta inscrição foi cancelada.':paid?'Pagamento quitado. Vagas garantidas!':guaranteed?'Vagas garantidas. Acompanhe suas parcelas.':data.reservationStatus==='RESERVED'?'Sua reserva foi registrada!':'Sua reserva expirou.';
  $('payment-description').textContent=!active?'Os lugares foram liberados.':data.reservationStatus==='EXPIRED'?'A reserva sem primeira parcela confirmada foi liberada após o prazo. Procure a secretaria se já pagou.':awaiting?'Seu comprovante foi recebido. Aguarde a conferência da secretaria.':paid?'O pagamento integral foi conferido. Guarde o PDF da inscrição.':'Escolha à vista, 2x ou 3x. Pague por Pix ou depósito e envie o comprovante.';
  $('registration-notice').textContent=guaranteed?'Primeira parcela confirmada: vagas garantidas. Quite as demais parcelas até 20/12/2026.':!active || data.reservationStatus==='EXPIRED'?'Esta inscrição não ocupa vagas nem autoriza entrada.':'Reserva provisória: a primeira parcela precisa ser confirmada para garantir as vagas.';
  $('payment-policy-message').textContent=awaiting?'Comprovante recebido. Não repita o Pix ou depósito desse pagamento. Aguarde a conferência.':paid?'Inscrição quitada. Este registro não substitui o comprovante bancário.':'A primeira parcela confirmada garante as vagas. Parcelas já vencidas devem ser pagas na inscrição.';
  $('registration-id').textContent=data.id;$('receipt-name').textContent=data.name;summary('receipt-summary',data.counts);$('confirmed-section').hidden=!active;
  const choosing=drawPaymentPanel($('payment-controls'),data,access,updated=>renderPayment(updated),true)===true;
  $('payment-financial-summary').hidden=choosing;$('payment-receipt').hidden=choosing;$('payment-status').hidden=choosing;$('payment-description').hidden=choosing;
  if(choosing)$('payment-title').textContent='Escolha como deseja pagar';
  $('pay-later').hidden=choosing || !active || data.reservationStatus==='EXPIRED' || paid;$('pay-later').textContent=awaiting?'VOLTAR AO INÍCIO':'VOLTAR AO INÍCIO E PAGAR DEPOIS';
  $('report-pix').href=secretariatWhatsAppLink(data);$('whatsapp-message-preview').textContent=secretariatMessage(data);
  $('reported-message').textContent='A mensagem contém os dados e a situação das parcelas. No WhatsApp, confira e toque em Enviar. Os comprovantes enviados pelo site ficam disponíveis no painel da secretaria.';

}
function secretariatWhatsAppLink(data) {

$('report-pix').onclick = () => {

let registrationRequest = null;
async function refreshRegistration(announce = false) {
  if (!access || registrationRequest) return registrationRequest;
  registrationRequest = (async () => {
    try { renderPayment(await api('lookup', access)); await refreshCapacity(); if (announce) message('payment-success', 'Inscrição atualizada.', true); }

$('refresh-payment').onclick = () => busy($('refresh-payment'), async () => { message('payment-error', ''); message('payment-success', ''); await refreshRegistration(true); });
function receiptPdf() {
  // Página estreita, proporcional à tela do telefone, sem reduzir o tamanho das letras.
  const pdf = new jspdf.jsPDF({ unit: 'pt', format: [420, 900], compress: true });
  const width = pdf.internal.pageSize.getWidth(), height = pdf.internal.pageSize.getHeight();
  const margin = 26, usable = width - margin * 2, green = '#143f32';
  let y = margin;
  pdf.setProperties({ title: 'Inscrição ' + current.id + ' | Ceia IPDiv 2026', author: 'Igreja Presbiteriana de Divinópolis' });
  function nextPage() {
    pdf.addPage(); y = margin;
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(12); pdf.setTextColor(green);
    pdf.text('CEIA IPDIV 2026 · SUA INSCRIÇÃO', margin, y + 12); y += 40;
  }
  function ensure(space) { if (y + space > height - 38) nextPage(); }
  function text(value, size = 16, bold = false, gap = 9) {
    pdf.setFont('helvetica', bold ? 'bold' : 'normal'); pdf.setFontSize(size); pdf.setTextColor(green);
    const lines = pdf.splitTextToSize(String(value).replaceAll('\u00a0', ' '), usable);
    // Quebra por linha para preservar todo o conteúdo mesmo com nomes e categorias longos.
    for (const line of lines) {
      ensure(size * 1.35);
      pdf.setFont('helvetica', bold ? 'bold' : 'normal'); pdf.setFontSize(size); pdf.setTextColor(green);
      pdf.text(line, margin, y + size); y += size * 1.35;
    }
    y += gap;
  }
  function heading(value) { ensure(66); y += 8; text(value, 19, true); }
  function name(value) {
    if (/^[\x20-\x7e\u00a0-\u00ff]*$/.test(value)) { text(value, 21, true); return; }
    // Nomes fora do alfabeto latino usam a fonte do celular, sem perder caracteres.
    const canvas = document.createElement('canvas'), scale = 3, lineHeight = 29;
    canvas.width = Math.ceil(usable * scale); canvas.height = 420 * scale;
    const ctx = canvas.getContext('2d'); ctx.scale(scale, scale); ctx.font = 'bold 21px system-ui';
    const lines = []; let line = '';
    for (const char of Array.from(value)) {
      if (ctx.measureText(line + char).width > usable) { lines.push(line); line = ''; }
      line += char;
    }
    if (line) lines.push(line);
    const nameHeight = lines.length * lineHeight; ensure(nameHeight + 9);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, usable, 420); ctx.fillStyle = green;
    lines.forEach((line, index) => ctx.fillText(line, 0, 23 + index * lineHeight));
    const crop = document.createElement('canvas'); crop.width = canvas.width; crop.height = Math.ceil(nameHeight * scale);
    crop.getContext('2d').drawImage(canvas, 0, 0);
    pdf.addImage(crop.toDataURL('image/png'), 'PNG', margin, y, usable, nameHeight); y += nameHeight + 9;
  }
  const logo = document.querySelector('img.official-logo');
  if (logo?.complete && logo.naturalWidth) {
    const logoWidth = 84, logoHeight = logoWidth * logo.naturalHeight / logo.naturalWidth;
    pdf.addImage(logo.src, 'PNG', margin, y, logoWidth, logoHeight);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(21); pdf.setTextColor(green);
    pdf.text('Ceia IPDiv 2026', margin + 124, y + 27);
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(12);
    pdf.text('Registro de inscrição', margin + 124, y + 48);
    y += Math.max(logoHeight, 60) + 18;
  } else heading('Ceia IPDiv 2026');
  text(reservationText(current.reservationStatus), 18, true);
  text(paymentText(current.paymentStatus), 15, true);
  text('Número: ' + current.id, 13);
  text('Responsável', 13); name(current.name);
  heading('Participantes');
  CONFIG.event.categories.filter(c => current.counts[c.key]).forEach(c => {
    ensure(75);
    text(current.counts[c.key] + ' × ' + c.label, 16, true, 3);
    text(money(current.counts[c.key] * c.price), 16);
  });
  ensure(85);
  text('Total de participantes: ' + current.people + (current.people === 1 ? ' pessoa' : ' pessoas'), 17, true);
  text('Valor da inscrição: ' + money(current.total), 21, true);
  text('Recebido: ' + money(current.payment.received) + ' · Saldo: ' + money(current.payment.balance), 15, true);
  current.payment.parts.forEach(p => text('Parcela ' + p.number + ': ' + money(p.amount) + ' · ' + dueLabel_(p.dueDate) + ' · ' + paymentText(p.status), 13));
  text('Pagamento por Pix ou depósito. A primeira parcela confirmada garante as vagas. Não é comprovante de pagamento.', 15);
  text('Registro em: ' + dateTime(current.createdAt), 12);
  text('Emitido em: ' + dateTime(new Date().toISOString()), 12);
  ensure(86); y += 7;
  pdf.setFillColor(green); pdf.roundedRect(margin, y, usable, 46, 7, 7, 'F');
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(17); pdf.setTextColor('#ffffff');
  pdf.text('Consultar minha inscrição', width / 2, y + 29, { align: 'center' });
  pdf.link(margin, y, usable, 46, { url: privateLink() }); y += 59;
  text('Toque no botão acima para consultar a situação atual. Este documento é particular.', 13);
  nextPage();
  heading('Esperamos vocês!');
  text(CONFIG.event.date, 22, true);
  heading(CONFIG.event.thanksgiving.name + ' às ' + CONFIG.event.thanksgiving.time);
  text(CONFIG.event.thanksgiving.venue, 17, true);
  text(CONFIG.event.thanksgiving.address, 16);
  heading('Ceia após o culto');
  text(CONFIG.event.venue, 17, true); text(CONFIG.event.address, 16);
  heading('Secretaria');
  text('(37) 3212-4980 (WhatsApp)', 18, true);
  text('Na chegada, informe o nome do responsável. A entrada será registrada para toda a inscrição familiar.', 16);
  const pages = pdf.getNumberOfPages();
  for (let page = 1; page <= pages; page++) {
    pdf.setPage(page); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(10); pdf.setTextColor(green);
    pdf.text('IPDiv · Registro de inscrição · ' + page + '/' + pages, margin, height - 17);
  }
  return pdf.output('arraybuffer');
}

function parseAccess(raw) {
  const hash = raw.includes('#') ? raw.slice(raw.indexOf('#') + 1) : raw.replace(/^#/, ''); const params = new URLSearchParams(hash);
  const id = params.get('id'), token = params.get('token');
  if (!/^IPD26[A-F0-9]{16}$/.test(id || '') || !/^[a-zA-Z0-9_-]{43}$/.test(token || '')) throw new Error('Cole o link individual completo, incluindo a parte depois de #.');
  return { id, token };
}

  await busy(button,async()=>{try{let box=card.querySelector('.lookup-payment-box');if(!box){box=el('div',undefined,'lookup-payment-box');card.append(box);}const render=data=>{drawPaymentPanel(box,data,credentials,render);card.querySelector('.lookup-payment-state').textContent=paymentText(data.paymentStatus);};render(await api('paymentDetails',credentials));box.scrollIntoView({block:'start'});}catch(error){message('status-lookup-error',error.message);}});
}

    const card = el('div', undefined, 'card'); card.style.marginTop = '16px';

    card.append(el('strong', reservationText(row.reservationStatus), 'status' + (row.reservationStatus === 'CONFIRMED' ? ' paid' : '')));
    card.append(el('p', paymentText(row.paymentStatus), 'lookup-payment-state'));
    card.append(el('p', row.reservationStatus === 'CONFIRMED' ? 'Pagamento e comprovante conferidos: lugares garantidos.' : row.reservationStatus === 'RESERVED' ? 'Reserva até 20/12/2026. Garanta os lugares com Pix e comprovante conferido.' : 'Os lugares desta inscrição foram liberados.'));
    card.append(el('p', row.people + (row.people === 1 ? ' participante' : ' participantes')));
    card.append(el('p', 'Cadastro em: ' + dateTime(row.createdAt), 'small muted'));

    }

async function loadAccess(raw) { access = parseAccess(raw); const result = await api('lookup', access); renderPayment(result); updateHash(); show('payment'); await refreshCapacity(); }
async function initialLocation(hash) {
  if (hash && /(?:^#?|&)id=/.test(hash)) { show('lookup'); try { await loadAccess(hash); } catch (e) { message('status-lookup-error', e.message); } return; }
  try {
    const active = JSON.parse(sessionStorage.getItem('ceia-active'));
    if (active) { await loadAccess(new URLSearchParams(active).toString()); return; }
    const pending = JSON.parse(sessionStorage.getItem('ceia-pending'));
    if (pending && CONFIG.open) {
      requestId = pending.requestId; $('name').value = pending.name; $('phone').value = formatPhone(pending.phone);
