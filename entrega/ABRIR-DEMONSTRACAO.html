<body><header><h1>Demonstração para análise · Ceia IPDiv 2026</h1><p>Teste as telas e os botões. Os dados são fictícios e ficam só nesta aba. Sem login Google, sem envio à planilha e sem pagamentos reais. Fechar ou recarregar apaga os testes.</p><nav aria-label="Áreas da demonstração"><button data-panel="registration" aria-pressed="true">1. INSCRIÇÃO</button><button data-panel="treasury" aria-pressed="false">2. TESOURARIA</button><button data-panel="door" aria-pressed="false">3. ENTRADA</button><button id="restart">REINICIAR ANÁLISE</button></nav></header><iframe id="registration-app" title="Página de inscrição para análise"></iframe><iframe id="app" title="Painel administrativo para análise" hidden></iframe><noscript>Abra este arquivo no Microsoft Edge ou Google Chrome com JavaScript habilitado.</noscript><script>(() => {
/** Regras compartilhadas. Valores monetários sempre em centavos. */
var EVENT_ = Object.freeze({
  name: 'Ceia de Confraternização 2026',
  church: 'Igreja Presbiteriana de Divinópolis',
  date: '31/12/2026',
  venue: 'Salão Imperatriz',
  address: 'Rua Duarte, 70, Bairro Catalão, esquina com a Rua Paraná, Divinópolis, MG',
  thanksgiving: {
    name: 'Culto de Ações de Graças',
    time: '20h30min',
    venue: 'Templo da IPDiv',
    address: 'Av. Paraná, 1098 — Sidil, Divinópolis, MG'
  },
  mealTiming: 'Após o culto',
  deadline: '2026-12-21T03:00:00.000Z', // 21/12 00h00 em Brasília (UTC−3), limite exclusivo.
  categories: [
    { key: 'adultMembers', label: 'Adultos membros', price: 8000 },
    { key: 'childMembers', label: 'Crianças membros até 12 anos', price: 4000 },
    { key: 'spouse', label: 'Cônjuge adulto não-membro da igreja', price: 8000 },
    { key: 'adultGuests', label: 'Adultos não membros, incluindo filhos com 13 anos ou mais', price: 12000 },
    { key: 'childGuests', label: 'Crianças não membros até 12 anos', price: 6000 }
  ]
});

function fail_(message) { throw new Error(message); }
function cleanText_(value, max, label) {
  if (typeof value !== 'string') fail_('Informe ' + label + '.');
  var text = value.trim().replace(/\s+/g, ' ');
  if (!text || text.length > max || /[\u0000-\u001f\u007f]/.test(text)) fail_('Confira ' + label + '.');
  // Evita fórmulas ao gravar texto livre no Google Planilhas.
  if (/^[=+@\-]/.test(text)) fail_('Use texto simples em ' + label + '.');
  return text;
}
function calculate_(counts) {
  if (!counts || typeof counts !== 'object' || Array.isArray(counts)) fail_('Informe as quantidades.');
  if (Object.keys(counts).some(function(k) { return !EVENT_.categories.some(function(c) { return c.key === k; }); })) fail_('Categoria inválida.');
  var people = 0, total = 0, normalized = {};
  EVENT_.categories.forEach(function(c) {
    var n = counts[c.key];
    if (!Number.isInteger(n) || n < 0 || n > 100) fail_('Quantidade inválida em ' + c.label + '. Use de 0 a 100.');
    normalized[c.key] = n; people += n; total += n * c.price;
  });
  if (people < 1 || people > 100) fail_('A inscrição deve incluir de 1 a 100 pessoas. Para grupos maiores, faça outra inscrição.');
  if (normalized.spouse > 1 || (normalized.spouse && !normalized.adultMembers)) fail_('A tarifa especial permite um cônjuge e exige pelo menos um adulto membro.');
  return { counts: normalized, people: people, total: total };
}
function registrationInput_(input) {
  if (!input || typeof input !== 'object') fail_('Dados inválidos.');
  var name = cleanText_(input.name, 120, 'o nome do responsável');
  if (name.length < 3) fail_('Informe o nome do responsável com pelo menos 3 letras.');
  if (typeof input.phone !== 'string' || /[^\d\s()+\-]/.test(input.phone)) fail_('Confira o WhatsApp com DDD.');
  var phone = input.phone.replace(/\D/g, '');
  if ((phone.length === 12 || phone.length === 13) && phone.indexOf('55') === 0) phone = phone.slice(2);
  if (!/^[1-9][0-9](?:[2-8][0-9]{7}|9[0-9]{8})$/.test(phone)) fail_('Informe um telefone brasileiro válido com DDD.');
  if (typeof input.requestId !== 'string' || !/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(input.requestId)) fail_('Atualize a página e tente novamente.');
  var calculated = calculate_(input.counts);
  return { name: name, phone: phone, counts: calculated.counts, people: calculated.people, total: calculated.total, requestId: input.requestId };
}
function assertOpen_(now) {
  if (new Date(now).getTime() >= Date.parse(EVENT_.deadline)) fail_('O prazo de inscrições encerrou em 20/12/2026, às 23h59 (Brasília). A consulta continua disponível.');
}
function assertRole_(actor, roles) {
  if (!actor || roles.indexOf(actor.role) < 0) fail_('Acesso não autorizado para esta ação.');
}
function paymentTransition_(row, actor, paid, now, note) {
  assertRole_(actor, ['treasury', 'admin']);
  if (typeof paid !== 'boolean') fail_('Situação de pagamento inválida.');
  if (row.status === 'PAID' && paid) return false;
  if (row.status !== 'PAID' && !paid) return false;
  if (!paid && row.entryAt) fail_('Uma inscrição com entrada registrada não pode ter seu pagamento desfeito.');
  var reason = cleanText_(note, 250, 'a referência da conferência bancária ou motivo da alteração');
  row.status = paid ? 'PAID' : 'PENDING';
  row.paidAt = paid ? now : '';
  row.paidBy = paid ? actor.email : '';
  row.audit.push({ at: now, by: actor.email, action: paid ? 'PAYMENT_CONFIRMED' : 'PAYMENT_REVERSED', note: reason, amount: row.total });
  return true;
}
function entryTransition_(row, actor, now, overrideReason) {
  assertRole_(actor, ['door', 'admin']);
  if (row.entryAt) fail_('Entrada já registrada em ' + row.entryAt + '.');
  var override = row.status !== 'PAID';
  if (override) {
    assertRole_(actor, ['admin']);
    overrideReason = cleanText_(overrideReason, 250, 'o motivo da liberação excepcional');
  }
  row.entryAt = now;
  row.entryBy = actor.email;
  row.entryOverride = override;
  row.audit.push({ at: now, by: actor.email, action: override ? 'ENTRY_OVERRIDE' : 'ENTRY_CONFIRMED', note: override ? overrideReason : '' });
}
function metrics_(rows) {
  return rows.reduce(function(m, r) {
    m.families++; m.people += r.people;
    if (r.status === 'PAID') { m.paidPeople += r.people; m.received += r.total; }
    else { m.pendingPeople += r.people; m.pending += r.total; }
    if (r.entryAt) { m.enteredFamilies++; m.enteredPeople += r.people; }
    return m;
  }, { families: 0, people: 0, paidPeople: 0, pendingPeople: 0, received: 0, pending: 0, enteredFamilies: 0, enteredPeople: 0 });
}

function adminRow_(r, actor) {
  var out = { id: r.id, name: r.name, phone: r.phone, people: r.people, status: r.status,
    entryAt: r.entryAt, entryOverride: r.entryOverride };
  if (actor.role !== 'door') {
    out.total = r.total; out.counts = r.counts; out.createdAt = r.createdAt; out.reportedAt = r.reportedAt;
    out.proofAt = r.proofAt; out.paidAt = r.paidAt; out.paidBy = r.paidBy; out.audit = r.audit;
  }
  return out;
}

// Simulador exclusivo da demonstração offline. Nunca é copiado para Apps Script.
const demoRows = [], demoRequests = new Map();
const cloneDemo = value => JSON.parse(JSON.stringify(value));
const demoNow = () => new Date().toISOString();
function demoUuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = Array.from(b, n => n.toString(16).padStart(2, '0')).join('');
  return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
}
function demoToken() { return btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32)))).replaceAll('+', '-').replaceAll('/', '_').replace(/=+$/, ''); }
function demoPublicRow(row) {
  return { id: row.id, name: row.name, counts: row.counts, people: row.people, total: row.total,
    status: row.status, reportedAt: row.reportedAt || '', proofAt: row.proofAt || '', paidAt: row.paidAt || '', entryAt: row.entryAt || '',
    pix: row.status === 'PAID' ? '' : 'DEMONSTRACAO IPDIV 2026 - SEM VALIDADE PARA PAGAMENTO', event: EVENT_ };
}
function demoCreate(input) {
  const valid = registrationInput_(input), payload = JSON.stringify([valid.name, valid.phone, valid.counts]);
  if (demoRequests.has(valid.requestId)) {
    const previous = demoRequests.get(valid.requestId);
    if (previous.payload !== payload) fail_('Este envio já foi recebido com outros dados.');
    return { ...demoPublicRow(previous.row), token: previous.row.token };
  }
  const row = { ...valid, id: 'IPD26' + demoUuid().replaceAll('-', '').slice(0, 16).toUpperCase(), token: demoToken(), createdAt: demoNow(), status: 'PENDING', audit: [] };
  demoRows.push(row); demoRequests.set(valid.requestId, { row, payload });
  return { ...demoPublicRow(row), token: row.token };
}
function demoAuthorizedRow(input) {
  const row = demoRows.find(r => r.id === input.id);
  if (!row || row.token !== input.token) fail_('Link de demonstração inválido. Ele funciona apenas enquanto esta análise estiver aberta.');
  return row;
}
function demoApi(mode, action, input = {}, role = 'admin') {
  try {
    let result;
    if (mode === 'public') {
      if (action === 'create') result = demoCreate(input);
      else if (['lookup', 'report', 'proof'].includes(action)) {
        const row = demoAuthorizedRow(input);
        if (action === 'report' && !row.reportedAt) row.reportedAt = demoNow();
        if (action === 'proof' && !row.proofAt) {
          if (typeof input.base64 !== 'string' || input.base64.length > 1398104) fail_('Use arquivo de até 1 MB.');
          const bytes = atob(input.base64);
          const mime = bytes.startsWith('%PDF-') ? 'application/pdf' : bytes.startsWith('\x89PNG\r\n\x1a\n') ? 'image/png' : bytes.startsWith('\xff\xd8\xff') ? 'image/jpeg' : '';
          if (!mime) fail_('Use PDF, JPG ou PNG.');
          row.proofAt = demoNow(); row.proof = { base64: input.base64, mime, name: row.id + (mime === 'application/pdf' ? '.pdf' : mime === 'image/png' ? '.png' : '.jpg') };
        }
        result = demoPublicRow(row);
      } else fail_('Ação inválida na demonstração.');
    } else {
      const actor = { email: 'demonstracao@exemplo.invalid', role };
      assertRole_(actor, ['admin', 'door']);
      if (action === 'list') {
        const metrics = metrics_(demoRows);
        if (role === 'door') { delete metrics.received; delete metrics.pending; }
        result = { actor, metrics, rows: demoRows.map(r => adminRow_(r, actor)) };
      } else {
        const row = demoRows.find(r => r.id === input.id);
        if (!row) fail_('Inscrição não encontrada.');
        if (action === 'payment') paymentTransition_(row, actor, input.paid, demoNow(), input.note);
        else if (action === 'entry') entryTransition_(row, actor, demoNow(), input.reason);
        else if (action === 'getProof') { assertRole_(actor, ['admin']); if (!row.proof) fail_('Sem comprovante.'); result = row.proof; }
        else fail_('Ação inválida na demonstração.');
        if (!result) result = adminRow_(row, actor);
      }
    }
    return cloneDemo({ ok: true, data: result });
  } catch (e) { return { ok: false, error: e.message || 'Falha na demonstração.' }; }
}
// Exemplos fictícios para permitir analisar o painel antes de cadastrar uma família.
for (const [name, people, paid, entered] of [['José da Silva (exemplo)', 4, true, false], ['Maria Oliveira (exemplo)', 2, true, true], ['João Pereira (exemplo)', 3, false, false]]) {
  const created = demoCreate({ name, phone: '(37) 99999-0000', requestId: demoUuid(), counts: { adultMembers: people, childMembers: 0, spouse: 0, adultGuests: 0, childGuests: 0 } });
  if (paid) demoApi('admin', 'payment', { id: created.id, paid: true, note: 'Exemplo fictício, sem transação bancária' });
  if (entered) demoApi('admin', 'entry', { id: created.id });
}
window.ceiaOfflineApi = demoApi;
const demoSession = new Map();
window.ceiaDemoSession = { getItem: key => demoSession.get(key) || null, setItem: (key, val) => demoSession.set(key, val), removeItem: key => demoSession.delete(key) };

eps\" aria-label=\"Como funciona\">\u003cspan>\u003cb class=\"step-number\">1\u003c/b> Informe seus dados e quantidades\u003c/span>\u003cspan>\u003cb class=\"step-number\">2\u003c/b> Confira e pague com Pix\u003c/span>\u003cspan>\u003cb class=\"step-number\">3\u003c/b> Aguarde a confirmação da tesouraria\u003c/span>\u003c/div>\n\u003c/section>\n\u003csection id=\"form-view\" class=\"section\" hidden aria-labelledby=\"form-title\">\n  \u003cdiv class=\"section-head\">\u003cp class=\"eyebrow\">Passo 1 de 2 · Sua inscrição\u003c/p>\u003ch2 id=\"form-title\" tabindex=\"-1\">Vamos reunir a família.\u003c/h2>\u003cp class=\"muted\">Informe apenas os dados do responsável e a quantidade de participantes. Não é preciso informar os nomes dos familiares.\u003c/p>\u003cp class=\"registration-deadline\">Inscrições até \u003cstrong>20/12/2026\u003c/strong>, às 23h59 (Brasília).\u003c/p>\u003c/div>\n  \u003cdiv id=\"form-error\" role=\"alert\" tabindex=\"-1\" hidden>\u003c/div>\n  \u003cform id=\"registration-form\">\u003cdiv class=\"form-grid\">\u003cdiv class=\"card\">\u003cdiv class=\"fields\">\u003cdiv class=\"field\">\u003clabel for=\"name\">Nome do responsável\u003c/label>\u003cinput id=\"name\" name=\"name\" autocomplete=\"name\" required minlength=\"3\" maxlength=\"120\" placeholder=\"Seu nome completo\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"phone\">WhatsApp com DDD\u003c/label>\u003cinput id=\"phone\" name=\"phone\" autocomplete=\"tel-national\" inputmode=\"tel\" type=\"tel\" required maxlength=\"20\" placeholder=\"(37) 99999-9999\">\u003csmall>Para contato da organização sobre esta inscrição.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"categories\">\u003ch3>Quem vai participar?\u003c/h3>\u003cp class=\"small muted\">Use + e − para ajustar as quantidades.\u003c/p>\u003cdiv id=\"categories\">\u003c/div>\u003c/div>\u003cdiv class=\"notice rules\">\u003cstrong>Qual categoria escolher?\u003c/strong>\u003cul>\u003cli>A idade é considerada em \u003cstrong>31/12/2026\u003c/strong>. Crianças têm até 12 anos, inclusive. A partir de 13 anos, vale a tarifa de adulto.\u003c/li>\u003cli>Filhos não membros pagam a tarifa de não membro, independentemente da condição dos pais.\u003c/li>\u003cli>A tarifa de cônjuge permite apenas um adulto não membro e exige pelo menos um adulto membro nesta inscrição.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n  \u003caside class=\"card summary\">\u003ch3>Sua família, à mesa.\u003c/h3>\u003cdiv id=\"live-summary\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/div>\u003cp class=\"consent\">Usaremos seu nome e WhatsApp somente para organizar a ceia, conferir o pagamento e registrar a entrada. Apenas a equipe autorizada terá acesso. Procure a organização para corrigir ou excluir seus dados.\u003c/p>\u003cbutton class=\"btn full\" type=\"submit\" id=\"review-button\">CONFERIR INSCRIÇÃO \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/button>\u003cp class=\"small muted\" style=\"margin:16px 0 0\">Você revisará tudo antes de confirmar.\u003c/p>\u003c/aside>\u003c/div>\u003c/form>\n\u003c/section>\n\u003csection id=\"review-view\" class=\"section centered\" hidden aria-labelledby=\"review-title\">\u003cdiv class=\"section-head\">\u003cp class=\"eyebrow\">Passo 2 de 2 · Confira os dados\u003c/p>\u003ch2 id=\"review-title\" tabindex=\"-1\">Tudo certo para celebrar?\u003c/h2>\u003cp class=\"muted\">Confira sua inscrição antes de gerar o Pix.\u003c/p>\u003c/div>\u003cdiv id=\"review-error\" role=\"alert\" tabindex=\"-1\" hidden>\u003c/div>\u003cdiv class=\"card\">\u003ch3 id=\"review-name\">\u003c/h3>\u003cp id=\"review-phone\" class=\"muted small\">\u003c/p>\u003cdiv id=\"review-summary\">\u003c/div>\u003cdiv class=\"notice\">Após confirmar, guarde seu link individual para consultar o pagamento. A confirmação é feita pela tesouraria após a conferência no banco.\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn secondary\" id=\"edit\">CORRIGIR INSCRIÇÃO\u003c/button>\u003cbutton class=\"btn\" id=\"confirm\">CONFIRMAR E PAGAR COM PIX\u003c/button>\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"payment-view\" class=\"section centered\" hidden aria-labelledby=\"payment-title\">\u003cdiv class=\"receipt-title\">\u003cspan id=\"payment-status\" class=\"status\">\u003c/span>\u003ch2 id=\"payment-title\" tabindex=\"-1\">\u003c/h2>\u003cp id=\"payment-description\" class=\"muted\">\u003c/p>\u003c/div>\u003cdiv id=\"payment-error\" role=\"alert\" tabindex=\"-1\" hidden>\u003c/div>\u003cdiv id=\"payment-success\" role=\"status\" hidden>\u003c/div>\u003cdiv class=\"card\">\u003cp class=\"eyebrow\">Sua inscrição\u003c/p>\u003cp class=\"registration-number\">\u003cstrong id=\"registration-id\">\u003c/strong>\u003c/p>\u003ch3 id=\"receipt-name\">\u003c/h3>\u003cdiv id=\"receipt-summary\">\u003c/div>\u003cdiv id=\"pix-section\" class=\"no-print\">\u003cdiv class=\"payment-grid\">\u003cdiv id=\"qr\" class=\"qr\" aria-label=\"QR Code Pix para pagamento\">\u003c/div>\u003cdiv>\u003ch3>Simulação do Pix\u003c/h3>\u003cp class=\"small muted\">Esta é uma demonstração. O QR Code e o texto abaixo não permitem fazer pagamentos.\u003c/p>\u003cbutton class=\"btn full\" id=\"copy-pix\">COPIAR CÓDIGO DE DEMONSTRAÇÃO\u003c/button>\u003c/div>\u003c/div>\u003clabel class=\"small\" for=\"pix-code\">Pix Copia e Cola\u003c/label>\u003ctextarea class=\"pix-code\" id=\"pix-code\" readonly spellcheck=\"false\">\u003c/textarea>\u003cdiv class=\"notice bank-details\">\u003cstrong>DEMONSTRAÇÃO — SEM COBRANÇA\u003c/strong>\u003cp>Nenhuma conta bancária é acionada. Para testar, avise que fez o Pix e simule a conferência na aba Tesouraria.\u003c/p>\u003c/div>\u003cbutton class=\"btn secondary full\" id=\"report-pix\">JÁ FIZ O PIX — AVISAR A TESOURARIA\u003c/button>\u003cp class=\"small muted\" id=\"reported-message\" style=\"margin-top:12px\">Avisar não confirma o pagamento. A tesouraria precisa conferir o recebimento no banco.\u003c/p>\u003cdetails id=\"proof-section\" style=\"margin:22px 0\">\u003csummary>Enviar comprovante (opcional)\u003c/summary>\u003cp class=\"small muted\" style=\"margin-top:15px\">Nesta demonstração, o arquivo fica somente na memória desta aba e é descartado ao fechar. Ele não confirma o recebimento. Envie PDF, JPG ou PNG de até 1 MB, evitando dados desnecessários.\u003c/p>\u003cdiv class=\"field\">\u003clabel for=\"proof-file\">Comprovante do Pix\u003c/label>\u003cinput id=\"proof-file\" type=\"file\" accept=\"image/jpeg,image/png,application/pdf\">\u003c/div>\u003cbutton class=\"btn secondary full\" id=\"upload-proof\" style=\"margin-top:14px\">ENVIAR COMPROVANTE\u003c/button>\u003cp class=\"small muted\" id=\"proof-status\" role=\"status\">\u003c/p>\u003c/details>\u003c/div>\u003cdiv id=\"confirmed-section\" hidden>\u003cdiv class=\"notice\">\u003cstrong>PAGAMENTO CONFIRMADO\u003c/strong>\u003cp id=\"paid-date\" class=\"small\">\u003c/p>\u003c/div>\u003ch3>Esperamos vocês!\u003c/h3>\u003cp>\u003cstrong>31/12/2026 · Culto de Ações de Graças às 20h30min\u003c/strong>\u003c/p>\u003cp class=\"small muted\">Templo da IPDiv — Av. Paraná, 1098 — Sidil, Divinópolis, MG.\u003c/p>\u003cp>\u003cstrong>Ceia após o culto · Salão Imperatriz\u003c/strong>\u003c/p>\u003cp class=\"small muted\">Rua Duarte, 70, Bairro Catalão, esquina com a Rua Paraná, Divinópolis, MG.\u003c/p>\u003cp class=\"small muted\">Na chegada, informe o nome do responsável. A entrada será registrada para toda a inscrição familiar.\u003c/p>\u003cdiv class=\"actions no-print\">\u003cbutton class=\"btn\" id=\"save-receipt\">SALVAR CONFIRMAÇÃO\u003c/button>\u003cbutton class=\"btn secondary\" id=\"print-receipt\">IMPRIMIR / SALVAR PDF\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"link-box no-print\">\u003ch3>Guarde seu link de consulta\u003c/h3>\u003cp class=\"small muted\">Este link de demonstração funciona apenas nesta análise aberta. A versão publicada terá um link individual protegido por token.\u003c/p>\u003cdiv class=\"field\">\u003clabel class=\"sr-only\" for=\"private-link\">Link individual de consulta\u003c/label>\u003cinput id=\"private-link\" readonly>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn secondary\" id=\"copy-link\">COPIAR MEU LINK\u003c/button>\u003cbutton class=\"btn secondary\" id=\"share-receipt\" disabled title=\"Compartilhamento real disponível após a publicação no Google\">COMPARTILHAR\u003c/button>\u003c/div>\u003c/div>\u003cbutton class=\"text-btn no-print\" id=\"refresh-payment\" style=\"width:100%;margin-top:15px\">Atualizar situação do pagamento\u003c/button>\u003c/div>\u003c/section>\n\u003csection id=\"lookup-view\" class=\"section centered\" hidden>\u003cp class=\"eyebrow\">Acompanhe sua inscrição\u003c/p>\u003ch2 id=\"lookup-title\" tabindex=\"-1\">Consultar pagamento\u003c/h2>\u003cp class=\"muted\">Abra o link individual recebido ao finalizar a inscrição ou cole esse link abaixo. Não é necessário fazer login Google.\u003c/p>\u003cform id=\"lookup-form\" class=\"card\">\u003cdiv id=\"lookup-error\" role=\"alert\" tabindex=\"-1\" hidden>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"lookup-link\">Seu link individual\u003c/label>\u003cinput id=\"lookup-link\" required type=\"text\" placeholder=\"Cole o link completo da inscrição\" autocomplete=\"off\">\u003c/div>\u003cbutton type=\"submit\" class=\"btn full\" id=\"lookup-button\" style=\"margin-top:22px\">CONSULTAR INSCRIÇÃO\u003c/button>\u003cp class=\"small muted\" style=\"margin:18px 0 0\">Perdeu o link? Procure a organização da Igreja. Não divulgamos inscrições por nome ou telefone.\u003c/p>\u003c/form>\u003c/section>\n\u003c/main>\u003cfooter>\u003cdiv class=\"container footer-inner\">\u003cspan>Igreja Presbiteriana de Divinópolis · Ceia 2026\u003c/span>\u003cspan>Feito para estarmos juntos.\u003c/span>\u003c/div>\u003c/footer>\n\u003cscript>const CONFIG = {\"event\":{\"name\":\"Ceia de Confraternização 2026\",\"church\":\"Igreja Presbiteriana de Divinópolis\",\"date\":\"31/12/2026\",\"venue\":\" =\"result-count\" aria-live=\"polite\">Carregando inscrições…\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003ccaption class=\"sr-only\">Inscrições da Ceia IPDiv 2026\u003c/caption>\u003cthead id=\"table-head\">\u003c/thead>\u003ctbody id=\"table-body\">\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"small muted print-note\" hidden>Lista de contingência — anote manualmente a entrada da família e concilie depois no sistema. Guarde a lista em local seguro.\u003c/p>\u003cp class=\"small muted\" id=\"updated-at\" style=\"margin-top:20px\">\u003c/p>\n\u003c/main>\n\u003cdialog id=\"action-dialog\" aria-labelledby=\"dialog-title\">\u003cform id=\"action-form\">\u003ch2 id=\"dialog-title\">\u003c/h2>\u003cp id=\"dialog-description\" class=\"muted\">\u003c/p>\u003cdiv id=\"dialog-error\" role=\"alert\" tabindex=\"-1\" hidden>\u003c/div>\u003cdiv class=\"field\">\u003clabel id=\"note-label\" for=\"action-note\">Referência da conferência no extrato\u003c/label>\u003ctextarea id=\"action-note\" rows=\"3\" required maxlength=\"250\" placeholder=\"Ex.: data, horário e referência do lançamento\">\u003c/textarea>\u003csmall id=\"dialog-help\">Confira o recebimento na conta do Itaú antes de confirmar. O aviso do participante não é comprovação.\u003c/small>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton type=\"button\" class=\"btn secondary\" id=\"cancel-dialog\">CANCELAR\u003c/button>\u003cbutton type=\"submit\" class=\"btn\" id=\"submit-action\">CONFIRMAR\u003c/button>\u003c/div>\u003c/form>\u003c/dialog>\n\u003cdialog id=\"audit-dialog\" aria-labelledby=\"audit-title\">\u003ch2 id=\"audit-title\">Histórico da inscrição\u003c/h2>\u003cdiv id=\"audit-content\">\u003c/div>\u003cbutton type=\"button\" class=\"btn secondary full\" id=\"close-audit\">FECHAR\u003c/button>\u003c/dialog>\n\u003cfooter>\u003cdiv class=\"container footer-inner\">\u003cspan>Igreja Presbiteriana de Divinópolis\u003c/span>\u003cspan>Dados pessoais · Acesso exclusivo da organização\u003c/span>\u003c/div>\u003c/footer>\n\u003cscript>const CONFIG = {\"event\":{\"name\":\"Ceia de Confraternização 2026\",\"church\":\"Igreja Presbiteriana de Divinópolis\",\"date\":\"31/12/2026\",\"venue\":\"Salão Imperatriz\",\"address\":\"Rua Duarte, 70, Bairro Catalão, esquina com a Rua Paraná, Divinópolis, MG\",\"thanksgiving\":{\"name\":\"Culto de Ações de Graças\",\"time\":\"20h30min\",\"venue\":\"Templo da IPDiv\",\"address\":\"Av. Paraná, 1098 — Sidil, Divinópolis, MG\"},\"mealTiming\":\"Após o culto\",\"deadline\":\"2026-12-21T03:00:00.000Z\",\"categories\":[{\"key\":\"adultMembers\",\"label\":\"Adultos membros\",\"price\":8000},{\"key\":\"childMembers\",\"label\":\"Crianças membros até 12 anos\",\"price\":4000},{\"key\":\"spouse\",\"label\":\"Cônjuge adulto não-membro da igreja\",\"price\":8000},{\"key\":\"adultGuests\",\"label\":\"Adultos não membros, incluindo filhos com 13 anos ou mais\",\"price\":12000},{\"key\":\"childGuests\",\"label\":\"Crianças não membros até 12 anos\",\"price\":6000}]},\"open\":true,\"mode\":\"admin\",\"url\":\"DEMONSTRACAO\",\"actor\":{\"email\":\"demonstracao@exemplo.invalid\",\"role\":\"admin\"}};\u003c/script>\u003cscript>\n'use strict';\nconst $ = (id) => document.getElementById(id);\nconst money = (n) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(n / 100);\nconst dateTime = (v) => v ? new Date(v).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }) : '—';\nfunction el(tag, text, className) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (className) e.className = className; return e; }\nfunction message(id, text, success = false) { const e = $(id); e.textContent = text || ''; e.className = success ? 'success' : 'error'; e.hidden = !text; if (text && !success) e.focus(); }\nfunction api(action, input = {}) {\n  return new Promise((resolve, reject) => {\n    const ok = (result) => result && result.ok ? resolve(result.data) : reject(new Error(result?.error || 'Resposta indisponível. Tente novamente.'));\n    const bad = () => reject(new Error('Não foi possível conectar. Confira sua conexão e tente novamente; o mesmo envio não será duplicado.'));\n    if (window.CEIA_DEMO) {\n      ok(parent.ceiaOfflineApi(CONFIG.mode, action, input, CONFIG.actor.role));\n    } else if (false) {\n      fetch('/api/' + CONFIG.mode, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, input }) }).then(r => r.json()).then(ok).catch(bad);\n    } else {\n      const runner = google.script.run.withSuccessHandler(ok).withFailureHandler(bad);\n      if (CONFIG.mode === 'admin') runner.adminApi(action, input); else runner.publicApi(action, input);\n    }\n  });\n}\nasync function busy(button, fn) {\n  if (button.disabled) return;\n  const text = button.textContent; button.disabled = true; button.textContent = 'Aguarde…'; button.setAttribute('aria-busy', 'true');\n  try { await fn(); } finally { button.textContent = text; button.disabled = false; button.removeAttribute('aria-busy'); }\n}\nasync function copyText(text, button) {\n  try {\n    if (navigator.clipboard) await navigator.clipboard.writeText(text);\n    else { const a = el('textarea'); a.value = text; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.append(a); a.select(); if (!document.execCommand('copy')) throw new Error(); a.remove(); }\n    const original = button.textContent; button.textContent = 'Copiado!'; setTimeout(() => button.textContent = original, 2300);\n  } catch { window.prompt('Copie o texto abaixo:', text); }\n}\nfunction download(name, text, type) {\n  const url = URL.createObjectURL(new Blob([text], { type })); const a = el('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);\n}\nfunction formatPhone(value) { const n = value.replace(/\\D/g, ''); return n.length === 11 ? '(' + n.slice(0, 2) + ') ' + n.slice(2, 7) + '-' + n.slice(7) : value; }\n\u003c/script>\n\u003cscript>\nlet state = { rows: [], metrics: {}, actor: CONFIG.actor }, area = CONFIG.actor.role === 'door' ? 'door' : 'treasury', pendingAction = null;\nconst roleNames = { admin: 'Administrador', treasury: 'Tesouraria', door: 'Conferência de entrada' };\n$('actor').textContent = state.actor.email + ' · ' + roleNames[state.actor.role];\nif (state.actor.role === 'door') $('tab-treasury').hidden = true;\nif (state.actor.role === 'treasury') $('tab-door').hidden = true;\nfunction setArea(next) {\n  area = next; $('admin-title').textContent = area === 'door' ? 'Conferência de entrada' : 'Painel da tesouraria';\n  $('tab-treasury').setAttribute('aria-selected', area === 'treasury'); $('tab-door').setAttribute('aria-selected', area === 'door'); renderTable();\n}\n$('tab-treasury').onclick = () => setArea('treasury'); $('tab-door').onclick = () => setArea('door');\nfunction renderMetrics() {\n  const m = state.metrics; $('metrics').replaceChildren();\n  const items = [['Famílias inscritas', m.families], ['Total de participantes', m.people], ['Pessoas com pagamento confirmado', m.paidPeople], ['Pessoas com pagamento pendente', m.pendingPeople]];\n  if (state.actor.role !== 'door') items.push(['Valor total recebido', money(m.received)], ['Valor ainda pendente', money(m.pending)]);\n  items.push(['Famílias que já entraram', m.enteredFamilies], ['Pessoas nas entradas (estimativa)', m.enteredPeople]);\n  items.forEach(([label, value]) => { const card = el('div', undefined, 'metric'); card.append(el('span', label), el('strong', String(value ?? 0))); $('metrics').append(card); });\n}\nfunction normalized(value) { return String(value).normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toLowerCase(); }\nfunction filteredRows() {\n  const q = normalized($('search').value.trim()), digits = q.replace(/\\D/g, '');\n  return state.rows.filter(r => {\n    const match = !q || normalized(r.name).includes(q) || normalized(r.id).includes(q) || (digits.length > 1 && !/[a-z]/.test(q) && r.phone.includes(digits));\n    return match && ($('payment-filter').value === 'all' || r.status === $('payment-filter').value) && ($('entry-filter').value === 'all' || (Boolean(r.entryAt) === ($('entry-filter').value === 'entered')));\n  }).sort((a, b) => (Number(b.status === 'PAID') - Number(a.status === 'PAID')) || a.name.localeCompare(b.name, 'pt-BR'));\n}\nfunction badge(text, paid) { return el('span', text, 'status' + (paid ? ' paid' : '')); }\nfunction actionButton(text, fn, disabled = false) { const b = el('button', text, 'btn secondary'); b.type = 'button'; b.disabled = disabled; b.onclick = fn; return b; }\nfunction renderTable() {\n  $('table-head').replaceChildren(); const header = el('tr');\n  const columns = ['Responsável', 'Pessoas', 'Pagamento', ...(area === 'treasury' ? ['Valor'] : []), 'Entrada', 'Ação'];\n  columns.forEach(title => { const th = el('th', title); th.scope = 'col'; header.append(th); }); $('table-head').append(header);\n  const root = $('table-body'); root.replaceChildren(); const rows = filteredRows();\n  $('result-count').textContent = rows.length + (rows.length === 1 ? ' inscrição encontrada' : ' inscrições encontradas');\n  if (!rows.length) { const tr = el('tr'), td = el('td', 'Nenhuma inscrição encontrada.', 'empty'); td.colSpan = columns.length; tr.append(td); root.append(tr); }\n  rows.forEach(r => {\n    const tr = el('tr', undefined, r.status === 'PAID' ? 'is-paid' : ''), name = el('td'); name.append(el('strong', r.name), el('small', formatPhone(r.phone)), el('small', r.id)); tr.append(name, el('td', String(r.people)));\n    const payment = el('td'); payment.append(badge(r.status === 'PAID' ? 'PAGO' : 'PENDENTE', r.status === 'PAID'));\n    if (r.reportedAt) payment.append(el('small', 'Participante avisou que pagou'));\n    tr.append(payment); if (area === 'treasury') tr.append(el('td', money(r.total)));\n    const entry = el('td'); entry.append(el('span', r.entryAt ? 'Confirmada' : 'Pendente')); if (r.entryAt) entry.append(el('small', dateTime(r.entryAt))); if (r.entryOverride) entry.append(el('small', 'Liberação excepcional')); tr.append(entry);\n    const actions = el('td');\n    if (area === 'treasury') {\n      actions.append(actionButton(r.status === 'PAID' ? 'DESFAZER PAGAMENTO' : 'CONFIRMAR PAGAMENTO', () => openDialog(r, 'payment'), Boolean(r.entryAt) && r.status === 'PAID'));\n      actions.append(el('br'), actionButton('Histórico', () => openAudit(r)));\n      if (r.proofAt) actions.append(el('br'), actionButton('Baixar comprovante', () => getProof(r, actions.lastChild)));\n    } else if (r.entryAt) actions.append(el('span', 'ENTRADA REGISTRADA', 'small muted'));\n    else if (r.status === 'PAID') actions.append(actionButton('CONFIRMAR ENTRADA', () => confirmEntry(r, actions.firstChild)));\n    else if (state.actor.role === 'admin') actions.append(actionButton('LIBERAÇÃO EXCEPCIONAL', () => openDialog(r, 'override')));\n    else actions.append(el('span', 'Aguarde a tesouraria', 'small muted'));\n    tr.append(actions); root.append(tr);\n  });\n}\nasync function load() {\n  message('admin-error', '');\n  try { state = await api('list'); renderMetrics(); renderTable(); $('updated-at').textContent = 'Dados atualizados em ' + dateTime(new Date().toISOString()) + ' (Brasília). Atualize antes de conferir pagamentos ou entradas.'; }\n  catch (e) { message('admin-error', e.message); $('result-count').textContent = 'Não foi possível carregar a lista.'; }\n}\n$('reload').onclick = () => busy($('reload'), load);\nfor (const id of ['search', 'payment-filter', 'entry-filter']) $(id).addEventListener(id === 'search' ? 'input' : 'change', renderTable);\nfunction openDialog(row, action) {\n  pendingAction = { row, action }; $('action-note').value = ''; message('dialog-error', '');\n  const pay = action === 'payment', undo = pay && row.status === 'PAID';\n  $('dialog-title').textContent = pay ? (undo ? 'Desfazer confirmação?' : 'Confirmar recebimento?') : 'Liberar entrada não paga?';\n  $('dialog-description').textContent = row.name + ' · ' + row.people + ' pessoa(s)' + (pay ? ' · ' + money(row.total) : '');\n  $('note-label').textContent = pay && !undo ? 'Referência do recebimento no extrato do Itaú' : 'Motivo obrigatório';\n  $('dialog-help').textContent = pay ? 'Esta ação ficará registrada com sua conta Google, data e horário. Confira o extrato bancário.' : 'Somente o administrador pode liberar uma inscrição pendente. O pagamento continuará pendente e o motivo será registrado.';\n  $('action-dialog').showModal();\n}\n$('cancel-dialog').onclick = () => $('action-dialog').close();\n$('action-form').onsubmit = e => {\n  e.preventDefault(); busy($('submit-action'), async () => {\n    message('dialog-error', ''); const { row, action } = pendingAction;\n    try {\n      if (action === 'payment') await api('payment', { id: row.id, paid: row.status !== 'PAID', note: $('action-note').value });\n      else await api('entry', { id: row.id, reason: $('action-note').value });\n      $('action-dialog').close(); message('admin-success', action === 'payment' ? 'Situação do pagamento atualizada. Alteração registrada no histórico.' : 'Entrada excepcional registrada; o pagamento permanece pendente.', true); await load();\n    } catch (e) { message('dialog-error', e.message); }\n  });\n};\nasync function confirmEntry(row, button) {\n  await busy(button, async () => {\n    message('admin-error', '');\n    try { await api('entry', { id: row.id }); message('admin-success', 'Entrada confirmada: ' + row.name + ' · ' + row.people + ' pessoa(s).', true); await load(); }\n    catch (e) { await load(); message('admin-error', e.message); }\n  });\n}\nfunction openAudit(row) {\n  const root = $('audit-content'); root.replaceChildren(el('h3', row.name), el('p', row.id, 'small muted'));\n  const audit = el('div', undefined, 'audit');\n  const labels = { PAYMENT_CONFIRMED: 'Pagamento confirmado', PAYMENT_REVERSED: 'Pagamento desfeito', ENTRY_CONFIRMED: 'Entrada confirmada', ENTRY_OVERRIDE: 'Liberação excepcional' };\n  if (!row.audit?.length) audit.append(el('p', 'Nenhuma alteração registrada.'));\n  (row.audit || []).forEach(a => audit.append(el('p', (labels[a.action] || a.action) + '\\n' + dateTime(a.at) + ' · ' + a.by + (a.note ? '\\n' + a.note : ''))));\n  audit.style.whiteSpace = 'pre-wrap'; root.append(audit); $('audit-dialog').showModal();\n}\n$('close-audit').onclick = () => $('audit-dialog').close();\nfunction csvCell(v) { let s = String(v ?? ''); if (/^[\\s]*[=+@\\-\\t\\r\\n]/.test(s)) s = \"'\" + s; return '\"' + s.replaceAll('\"', '\"\"') + '\"'; }\n$('export').onclick = () => {\n  const treasury = area === 'treasury';\n  const header = ['Inscrição', 'Responsável', 'WhatsApp', 'Pessoas', 'Pagamento', ...(treasury ? ['Valor (R$)', 'Confirmado em', 'Conferido por', 'Aviso do participante', ...CONFIG.event.categories.map(c => c.label)] : []), 'Entrada em', 'Exceção'];\n  const rows = filteredRows().map(r => [r.id, r.name, r.phone, r.people, r.status === 'PAID' ? 'Pago' : 'Pendente', ...(treasury ? [(r.total / 100).toFixed(2).replace('.', ','), dateTime(r.paidAt), r.paidBy, dateTime(r.reportedAt), ...CONFIG.event.categories.map(c => r.counts[c.key])] : []), dateTime(r.entryAt), r.entryOverride ? 'Sim' : 'Não']);\n  download('ceia-ipdiv-' + area + '.csv', '\\uFEFF' + [header, ...rows].map(r => r.map(csvCell).join(';')).join('\\r\\n'), 'text/csv;charset=utf-8');\n};\n$('print-list').onclick = () => window.print();\nsetArea(area); load();\n\u003c/script>\n\n\u003cscript>\nasync function getProof(row, button) {\n  await busy(button, async () => {\n    try {\n      const file = await api('getProof', { id: row.id });\n      const bytes = Uint8Array.from(atob(file.base64), char => char.charCodeAt(0));\n      download(file.name, bytes, file.mime);\n    } catch (e) { message('admin-error', e.message); }\n  });\n}\n\u003c/script>\n\u003c/body>\u003c/html>\n","door":"\u003c!DOCTYPE html>\u003chtml lang=\"pt-BR\">\ load\">ATUALIZAR DADOS\u003c/button>\u003c/div>\n\u003cdiv class=\"admin-nav no-print\" role=\"tablist\" aria-label=\"Área de trabalho\">\u003cbutton id=\"tab-treasury\" role=\"tab\" aria-selected=\"true\">Tesouraria\u003c/button>\u003cbutton id=\"tab-door\" role=\"tab\" aria-selected=\"false\">Conferência de entrada\u003c/button>\u003c/div>\n\u003cdiv id=\"admin-error\" role=\"alert\" tabindex=\"-1\" hidden>\u003c/div>\u003cdiv id=\"admin-success\" role=\"status\" hidden>\u003c/div>\n\u003cdiv id=\"metrics\" class=\"metrics\">\u003c/div>\u003cp class=\"small muted\" id=\"estimate-note\">Pessoas nas entradas: estimativa pelas quantidades declaradas nas inscrições familiares, sem conferência individual.\u003c/p>\n\u003cdiv class=\"toolbar no-print\">\u003cdiv class=\"field\">\u003clabel for=\"search\">Pesquisar inscrição\u003c/label>\u003cinput id=\"search\" class=\"search\" type=\"search\" placeholder=\"Nome, WhatsApp ou número\" autocomplete=\"off\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"payment-filter\">Pagamento\u003c/label>\u003cselect id=\"payment-filter\">\u003coption value=\"all\">Todos\u003c/option>\u003coption value=\"PAID\">Confirmados\u003c/option>\u003coption value=\"PENDING\">Pendentes\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"entry-filter\">Entrada\u003c/label>\u003cselect id=\"entry-filter\">\u003coption value=\"all\">Todas\u003c/option>\u003coption value=\"pending\">Pendentes\u003c/option>\u003coption value=\"entered\">Realizadas\u003c/option>\u003c/select>\u003c/div>\u003c/div>\n\u003cdiv class=\"actions no-print\" style=\"margin:0 0 20px\">\u003cbutton class=\"btn secondary\" id=\"export\">EXPORTAR RELATÓRIO CSV\u003c/button>\u003cbutton class=\"btn secondary\" id=\"print-list\">IMPRIMIR LISTA FILTRADA\u003c/button>\u003c/div>\u003cp class=\"small muted\" id=\"result-count\" aria-live=\"polite\">Carregando inscrições…\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003ccaption class=\"sr-only\">Inscrições da Ceia IPDiv 2026\u003c/caption>\u003cthead id=\"table-head\">\u003c/thead>\u003ctbody id=\"table-body\">\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"small muted print-note\" hidden>Lista de contingência — anote manualmente a entrada da família e concilie depois no sistema. Guarde a lista em local seguro.\u003c/p>\u003cp class=\"small muted\" id=\"updated-at\" style=\"margin-top:20px\">\u003c/p>\n\u003c/main>\n\u003cdialog id=\"action-dialog\" aria-labelledby=\"dialog-title\">\u003cform id=\"action-form\">\u003ch2 id=\"dialog-title\">\u003c/h2>\u003cp id=\"dialog-description\" class=\"muted\">\u003c/p>\u003cdiv id=\"dialog-error\" role=\"alert\" tabindex=\"-1\" hidden>\u003c/div>\u003cdiv class=\"field\">\u003clabel id=\"note-label\" for=\"action-note\">Referência da conferência no extrato\u003c/label>\u003ctextarea id=\"action-note\" rows=\"3\" required maxlength=\"250\" placeholder=\"Ex.: data, horário e referência do lançamento\">\u003c/textarea>\u003csmall id=\"dialog-help\">Confira o recebimento na conta do Itaú antes de confirmar. O aviso do participante não é comprovação.\u003c/small>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton type=\"button\" class=\"btn secondary\" id=\"cancel-dialog\">CANCELAR\u003c/button>\u003cbutton type=\"submit\" class=\"btn\" id=\"submit-action\">CONFIRMAR\u003c/button>\u003c/div>\u003c/form>\u003c/dialog>\n\u003cdialog id=\"audit-dialog\" aria-labelledby=\"audit-title\">\u003ch2 id=\"audit-title\">Histórico da inscrição\u003c/h2>\u003cdiv id=\"audit-content\">\u003c/div>\u003cbutton type=\"button\" class=\"btn secondary full\" id=\"close-audit\">FECHAR\u003c/button>\u003c/dialog>\n\u003cfooter>\u003cdiv class=\"container footer-inner\">\u003cspan>Igreja Presbiteriana de Divinópolis\u003c/span>\u003cspan>Dados pessoais · Acesso exclusivo da organização\u003c/span>\u003c/div>\u003c/footer>\n\u003cscript>const CONFIG = {\"event\":{\"name\":\"Ceia de Confraternização 2026\",\"church\":\"Igreja Presbiteriana de Divinópolis\",\"date\":\"31/12/2026\",\"venue\":\"Salão Imperatriz\",\"address\":\"Rua Duarte, 70, Bairro Catalão, esquina com a Rua Paraná, Divinópolis, MG\",\"thanksgiving\":{\"name\":\"Culto de Ações de Graças\",\"time\":\"20h30min\",\"venue\":\"Templo da IPDiv\",\"address\":\"Av. Paraná, 1098 — Sidil, Divinópolis, MG\"},\"mealTiming\":\"Após o culto\",\"deadline\":\"2026-12-21T03:00:00.000Z\",\"categories\":[{\"key\":\"adultMembers\",\"label\":\"Adultos membros\",\"price\":8000},{\"key\":\"childMembers\",\"label\":\"Crianças membros até 12 anos\",\"price\":4000},{\"key\":\"spouse\",\"label\":\"Cônjuge adulto não-membro da igreja\",\"price\":8000},{\"key\":\"adultGuests\",\"label\":\"Adultos não membros, incluindo filhos com 13 anos ou mais\",\"price\":12000},{\"key\":\"childGuests\",\"label\":\"Crianças não membros até 12 anos\",\"price\":6000}]},\"open\":true,\"mode\":\"admin\",\"url\":\"DEMONSTRACAO\",\"actor\":{\"email\":\"demonstracao@exemplo.invalid\",\"role\":\"door\"}};\u003c/script>\u003cscript>\n'use strict';\nconst $ = (id) => document.getElementById(id);\nconst money = (n) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(n / 100);\nconst dateTime = (v) => v ? new Date(v).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }) : '—';\nfunction el(tag, text, className) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (className) e.className = className; return e; }\nfunction message(id, text, success = false) { const e = $(id); e.textContent = text || ''; e.className = success ? 'success' : 'error'; e.hidden = !text; if (text && !success) e.focus(); }\nfunction api(action, input = {}) {\n  return new Promise((resolve, reject) => {\n    const ok = (result) => result && result.ok ? resolve(result.data) : reject(new Error(result?.error || 'Resposta indisponível. Tente novamente.'));\n    const bad = () => reject(new Error('Não foi possível conectar. Confira sua conexão e tente novamente; o mesmo envio não será duplicado.'));\n    if (window.CEIA_DEMO) {\n      ok(parent.ceiaOfflineApi(CONFIG.mode, action, input, CONFIG.actor.role));\n    } else if (false) {\n      fetch('/api/' + CONFIG.mode, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, input }) }).then(r => r.json()).then(ok).catch(bad);\n    } else {\n      const runner = google.script.run.withSuccessHandler(ok).withFailureHandler(bad);\n      if (CONFIG.mode === 'admin') runner.adminApi(action, input); else runner.publicApi(action, input);\n    }\n  });\n}\nasync function busy(button, fn) {\n  if (button.disabled) return;\n  const text = button.textContent; button.disabled = true; button.textContent = 'Aguarde…'; button.setAttribute('aria-busy', 'true');\n  try { await fn(); } finally { button.textContent = text; button.disabled = false; button.removeAttribute('aria-busy'); }\n}\nasync function copyText(text, button) {\n  try {\n    if (navigator.clipboard) await navigator.clipboard.writeText(text);\n    else { const a = el('textarea'); a.value = text; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.append(a); a.select(); if (!document.execCommand('copy')) throw new Error(); a.remove(); }\n    const original = button.textContent; button.textContent = 'Copiado!'; setTimeout(() => button.textContent = original, 2300);\n  } catch { window.prompt('Copie o texto abaixo:', text); }\n}\nfunction download(name, text, type) {\n  const url = URL.createObjectURL(new Blob([text], { type })); const a = el('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);\n}\nfunction formatPhone(value) { const n = value.replace(/\\D/g, ''); return n.length === 11 ? '(' + n.slice(0, 2) + ') ' + n.slice(2, 7) + '-' + n.slice(7) : value; }\n\u003c/script>\n\u003cscript>\nlet state = { rows: [], metrics: {}, actor: CONFIG.actor }, area = CONFIG.actor.role === 'door' ? 'door' : 'treasury', pendingAction = null;\nconst roleNames = { admin: 'Administrador', treasury: 'Tesouraria', door: 'Conferência de entrada' };\n$('actor').textContent = state.actor.email + ' · ' + roleNames[state.actor.role];\nif (state.actor.role === 'door') $('tab-treasury').hidden = true;\nif (state.actor.role === 'treasury') $('tab-door').hidden = true;\nfunction setArea(next) {\n  area = next; $('admin-title').textContent = area === 'door' ? 'Conferência de entrada' : 'Painel da tesouraria';\n  $('tab-treasury').setAttribute('aria-selected', area === 'treasury'); $('tab-door').setAttribute('aria-selected', area === 'door'); renderTable();\n}\n$('tab-treasury').onclick = () => setArea('treasury'); $('tab-door').onclick = () => setArea('door');\nfunction renderMetrics() {\n  const m = state.metrics; $('metrics').replaceChildren();\n  const items = [['Famílias inscritas', m.families], ['Total de participantes', m.people], ['Pessoas com pagamento confirmado', m.paidPeople], ['Pessoas com pagamento pendente', m.pendingPeople]];\n  if (state.actor.role !== 'door') items.push(['Valor total recebido', money(m.received)], ['Valor ainda pendente', money(m.pending)]);\n  items.push(['Famílias que já entraram', m.enteredFamilies], ['Pessoas nas entradas (estimativa)', m.enteredPeople]);\n  items.forEach(([label, value]) => { const card = el('div', undefined, 'metric'); card.append(el('span', label), el('strong', String(value ?? 0))); $('metrics').append(card); });\n}\nfunction normalized(value) { return String(value).normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toLowerCase(); }\nfunction filteredRows() {\n  const q = normalized($('search').value.trim()), digits = q.replace(/\\D/g, '');\n  return state.rows.filter(r => {\n    const match = !q || normalized(r.name).includes(q) || normalized(r.id).includes(q) || (digits.length > 1 && !/[a-z]/.test(q) && r.phone.includes(digits));\n    return match && ($('payment-filter').value === 'all' || r.status === $('payment-filter').value) && ($('entry-filter').value === 'all' || (Boolean(r.entryAt) === ($('entry-filter').value === 'entered')));\n  }).sort((a, b) => (Number(b.status === 'PAID') - Number(a.status === 'PAID')) || a.name.localeCompare(b.name, 'pt-BR'));\n}\nfunction badge(text, paid) { return el('span', text, 'status' + (paid ? ' paid' : '')); }\nfunction actionButton(text, fn, disabled = false) { const b = el('button', text, 'btn secondary'); b.type = 'button'; b.disabled = disabled; b.onclick = fn; return b; }\nfunction renderTable() {\n  $('table-head').replaceChildren(); const header = el('tr');\n  const columns = ['Responsável', 'Pessoas', 'Pagamento', ...(area === 'treasury' ? ['Valor'] : []), 'Entrada', 'Ação'];\n  columns.forEach(title => { const th = el('th', title); th.scope = 'col'; header.append(th); }); $('table-head').append(header);\n  const root = $('table-body'); root.replaceChildren(); const rows = filteredRows();\n  $('result-count').textContent = rows.length + (rows.length === 1 ? ' inscrição encontrada' : ' inscrições encontradas');\n  if (!rows.length) { const tr = el('tr'), td = el('td', 'Nenhuma inscrição encontrada.', 'empty'); td.colSpan = columns.length; tr.append(td); root.append(tr); }\n  rows.forEach(r => {\n    const tr = el('tr', undefined, r.status === 'PAID' ? 'is-paid' : ''), name = el('td'); name.append(el('strong', r.name), el('small', formatPhone(r.phone)), el('small', r.id)); tr.append(name, el('td', String(r.people)));\n    const payment = el('td'); payment.append(badge(r.status === 'PAID' ? 'PAGO' : 'PENDENTE', r.status === 'PAID'));\n    if (r.reportedAt) payment.append(el('small', 'Participante avisou que pagou'));\n    tr.append(payment); if (area === 'treasury') tr.append(el('td', money(r.total)));\n    const entry = el('td'); entry.append(el('span', r.entryAt ? 'Confirmada' : 'Pendente')); if (r.entryAt) entry.append(el('small', dateTime(r.entryAt))); if (r.entryOverride) entry.append(el('small', 'Liberação excepcional')); tr.append(entry);\n    const actions = el('td');\n    if (area === 'treasury') {\n      actions.append(actionButton(r.status === 'PAID' ? 'DESFAZER PAGAMENTO' : 'CONFIRMAR PAGAMENTO', () => openDialog(r, 'payment'), Boolean(r.entryAt) && r.status === 'PAID'));\n      actions.append(el('br'), actionButton('Histórico', () => openAudit(r)));\n      if (r.proofAt) actions.append(el('br'), actionButton('Baixar comprovante', () => getProof(r, actions.lastChild)));\n    } else if (r.entryAt) actions.append(el('span', 'ENTRADA REGISTRADA', 'small muted'));\n    else if (r.status === 'PAID') actions.append(actionButton('CONFIRMAR ENTRADA', () => confirmEntry(r, actions.firstChild)));\n    else if (state.actor.role === 'admin') actions.append(actionButton('LIBERAÇÃO EXCEPCIONAL', () => openDialog(r, 'override')));\n    else actions.append(el('span', 'Aguarde a tesouraria', 'small muted'));\n    tr.append(actions); root.append(tr);\n  });\n}\nasync function load() {\n  message('admin-error', '');\n  try { state = await api('list'); renderMetrics(); renderTable(); $('updated-at').textContent = 'Dados atualizados em ' + dateTime(new Date().toISOString()) + ' (Brasília). Atualize antes de conferir pagamentos ou entradas.'; }\n  catch (e) { message('admin-error', e.message); $('result-count').textContent = 'Não foi possível carregar a lista.'; }\n}\n$('reload').onclick = () => busy($('reload'), load);\nfor (const id of ['search', 'payment-filter', 'entry-filter']) $(id).addEventListener(id === 'search' ? 'input' : 'change', renderTable);\nfunction openDialog(row, action) {\n  pendingAction = { row, action }; $('action-note').value = ''; message('dialog-error', '');\n  const pay = action === 'payment', undo = pay && row.status === 'PAID';\n  $('dialog-title').textContent = pay ? (undo ? 'Desfazer confirmação?' : 'Confirmar recebimento?') : 'Liberar entrada não paga?';\n  $('dialog-description').textContent = row.name + ' · ' + row.people + ' pessoa(s)' + (pay ? ' · ' + money(row.total) : '');\n  $('note-label').textContent = pay && !undo ? 'Referência do recebimento no extrato do Itaú' : 'Motivo obrigatório';\n  $('dialog-help').textContent = pay ? 'Esta ação ficará registrada com sua conta Google, data e horário. Confira o extrato bancário.' : 'Somente o administrador pode liberar uma inscrição pendente. O pagamento continuará pendente e o motivo será registrado.';\n  $('action-dialog').showModal();\n}\n$('cancel-dialog').onclick = () => $('action-dialog').close();\n$('action-form').onsubmit = e => {\n  e.preventDefault(); busy($('submit-action'), async () => {\n    message('dialog-error', ''); const { row, action } = pendingAction;\n    try {\n      if (action === 'payment') await api('payment', { id: row.id, paid: row.status !== 'PAID', note: $('action-note').value });\n      else await api('entry', { id: row.id, reason: $('action-note').value });\n      $('action-dialog').close(); message('admin-success', action === 'payment' ? 'Situação do pagamento atualizada. Alteração registrada no histórico.' : 'Entrada excepcional registrada; o pagamento permanece pendente.', true); await load();\n    } catch (e) { message('dialog-error', e.message); }\n  });\n};\nasync function confirmEntry(row, button) {\n  await busy(button, async () => {\n    message('admin-error', '');\n    try { await api('entry', { id: row.id }); message('admin-success', 'Entrada confirmada: ' + row.name + ' · ' + row.people + ' pessoa(s).', true); await load(); }\n    catch (e) { await load(); message('admin-error', e.message); }\n  });\n}\nfunction openAudit(row) {\n  const root = $('audit-content'); root.replaceChildren(el('h3', row.name), el('p', row.id, 'small muted'));\n  const audit = el('div', undefined, 'audit');\n  const labels = { PAYMENT_CONFIRMED: 'Pagamento confirmado', PAYMENT_REVERSED: 'Pagamento desfeito', ENTRY_CONFIRMED: 'Entrada confirmada', ENTRY_OVERRIDE: 'Liberação excepcional' };\n  if (!row.audit?.length) audit.append(el('p', 'Nenhuma alteração registrada.'));\n  (row.audit || []).forEach(a => audit.append(el('p', (labels[a.action] || a.action) + '\\n' + dateTime(a.at) + ' · ' + a.by + (a.note ? '\\n' + a.note : ''))));\n  audit.style.whiteSpace = 'pre-wrap'; root.append(audit); $('audit-dialog').showModal();\n}\n$('close-audit').onclick = () => $('audit-dialog').close();\nfunction csvCell(v) { let s = String(v ?? ''); if (/^[\\s]*[=+@\\-\\t\\r\\n]/.test(s)) s = \"'\" + s; return '\"' + s.replaceAll('\"', '\"\"') + '\"'; }\n$('export').onclick = () => {\n  const treasury = area === 'treasury';\n  const header = ['Inscrição', 'Responsável', 'WhatsApp', 'Pessoas', 'Pagamento', ...(treasury ? ['Valor (R$)', 'Confirmado em', 'Conferido por', 'Aviso do participante', ...CONFIG.event.categories.map(c => c.label)] : []), 'Entrada em', 'Exceção'];\n  const rows = filteredRows().map(r => [r.id, r.name, r.phone, r.people, r.status === 'PAID' ? 'Pago' : 'Pendente', ...(treasury ? [(r.total / 100).toFixed(2).replace('.', ','), dateTime(r.paidAt), r.paidBy, dateTime(r.reportedAt), ...CONFIG.event.categories.map(c => r.counts[c.key])] : []), dateTime(r.entryAt), r.entryOverride ? 'Sim' : 'Não']);\n  download('ceia-ipdiv-' + area + '.csv', '\\uFEFF' + [header, ...rows].map(r => r.map(csvCell).join(';')).join('\\r\\n'), 'text/csv;charset=utf-8');\n};\n$('print-list').onclick = () => window.print();\nsetArea(area); load();\n\u003c/script>\n\n\u003cscript>\nasync function getProof(row, button) {\n  await busy(button, async () => {\n    try {\n      const file = await api('getProof', { id: row.id });\n      const bytes = Uint8Array.from(atob(file.base64), char => char.charCodeAt(0));\n      download(file.name, bytes, file.mime);\n    } catch (e) { message('admin-error', e.message); }\n  });\n}\n\u003c/script>\n\u003c/body>\u003c/html>\n"};
